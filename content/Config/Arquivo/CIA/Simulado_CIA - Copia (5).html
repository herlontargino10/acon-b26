<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimulaCore</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='50' fill='%230f172a'/><circle cx='50' cy='50' r='42' fill='none' stroke='%233b82f6' stroke-width='6'/><text y='67' x='50' text-anchor='middle' font-family='system-ui,Arial,sans-serif' font-weight='900' font-size='54' fill='%23e2e8f0'>S</text></svg>">
<style>
/* ── Variáveis ──────────────────────────────────── */
:root {
  --bg:      #080d18;
  --surface: #0f172a;
  --card:    #111827;
  --card2:   #1a2235;
  --border:  #1e2d45;
  --txt:     #e2e8f0;
  --muted:   #64748b;
  --blue:    #3b82f6;
  --blue2:   #1d4ed8;
  --green:   #10b981;
  --red:     #ef4444;
  --amber:   #f59e0b;
  --r:       13px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family: system-ui,'Segoe UI',Arial,sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ── Cabeçalho fixo ─────────────────────────────── */
#header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(8,13,24,.97);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px 10px;
}
.hd-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.hd-brand-wrap {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.hd-brand {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--blue);
  line-height: 1.2;
}
.hd-subject-name {
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .06em;
  text-transform: uppercase;
  line-height: 1;
}

/* label de sessão na tela final */
.result-session-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--muted);
  margin-bottom: 6px;
}

/* rodapé discreto */
#app-footer {
  text-align: center;
  padding: 28px 20px 16px;
  font-size: 11px;
  color: var(--border);
  letter-spacing: .1em;
  text-transform: uppercase;
  user-select: none;
}
.hd-meta {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13px;
  color: var(--muted);
}
#timer {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--txt);
  min-width: 42px;
  transition: color .4s;
}
/* feedback visual do timer por tempo decorrido */
#timer.warn { color: var(--amber); }
#timer.crit { color: var(--red); }
#q-counter { font-weight: 700; color: var(--txt); }

/* barra de progresso */
.prog-track {
  height: 5px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 10px;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), #60a5fa);
  border-radius: 999px;
  transition: width .4s cubic-bezier(.4,0,.2,1);
  width: 0%;
  box-shadow: 0 0 8px rgba(96,165,250,.35);
}

/* estatísticas no header */
.stats-row {
  display: flex;
  gap: 16px;
  font-size: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.stat-it { display: flex; align-items: center; gap: 5px; }
/* aproveitamento destacado no canto direito */
.stat-pct {
  margin-left: auto;
  font-size: 13px;
  font-weight: 800;
  color: var(--txt);
  background: rgba(59,130,246,.12);
  border: 1px solid rgba(59,130,246,.25);
  border-radius: 6px;
  padding: 2px 8px;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dg { background: var(--green); }
.dr { background: var(--red); }
.dm { background: var(--muted); }
.da { background: var(--amber); }

/* badge de modo */
.mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  transition: .15s;
  user-select: none;
  white-space: nowrap;
}
.mode-badge.study { border-color: var(--green); color: var(--green); background: rgba(16,185,129,.1); }
.mode-badge.exam  { border-color: var(--amber); color: var(--amber); background: rgba(245,158,11,.1); }

/* ── Layout principal ───────────────────────────── */
#app { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }

/* ── Card ───────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 28px;
  box-shadow: 0 4px 40px rgba(0,0,0,.45);
}
/* animação só na troca de questão — evita jitter em pick/verify */
.card.entering { animation: fadeUp .2s ease; }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(7px); }
}
/* entrada da explicação */
@keyframes slideReveal {
  from { opacity:0; transform:translateY(-4px); }
}
/* resposta errada */
@keyframes shake {
  0%,100% { transform:translateX(0); }
  20%     { transform:translateX(-6px); }
  40%     { transform:translateX(6px); }
  60%     { transform:translateX(-4px); }
  80%     { transform:translateX(4px); }
}
/* resposta certa */
@keyframes pop {
  0%   { transform:scale(1); }
  45%  { transform:scale(1.013); }
  100% { transform:scale(1); }
}

/* ── Tela Home ──────────────────────────────────── */
.home-wrap { max-width: 520px; margin: 56px auto 0; }
.home-title { font-size: 30px; font-weight: 900; margin-bottom: 6px; }
.home-sub { color: var(--muted); margin-bottom: 26px; font-size: 14px; }

.home-opts { display: flex; flex-direction: column; gap: 11px; margin-bottom: 22px; }
.home-opt {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 18px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 11px;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
}
.home-opt:hover  { border-color: var(--blue); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.home-opt.active { border-color: var(--blue); background: rgba(59,130,246,.08); }
.home-opt-icon { font-size: 22px; }
.home-opt-text strong { display: block; font-size: 15px; }
.home-opt-text span   { font-size: 13px; color: var(--muted); }
.home-btn-row { display: flex; gap: 10px; }

/* ── Questão ────────────────────────────────────── */
.q-hd {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
  margin-bottom: 18px;
}
.q-tag {
  display: inline-flex; align-items: center;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(59,130,246,.13);
  border: 1px solid rgba(59,130,246,.28);
  color: #93c5fd;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
}
.btn-flag {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  padding: 5px 10px;
  cursor: pointer; font-size: 14px;
  transition: .15s; flex-shrink: 0;
  font-family: inherit;
}
.btn-flag:hover  { border-color: var(--amber); color: var(--amber); }
.btn-flag.flagged { background: rgba(245,158,11,.14); border-color: var(--amber); color: var(--amber); }

.q-text {
  font-size: 18px; font-weight: 600;
  color: var(--txt); line-height: 1.55;
  margin-bottom: 22px;
}

/* ── Opções MC ──────────────────────────────────── */
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  padding: 13px 17px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  display: flex; align-items: center; gap: 12px;
  user-select: none;
  font-size: 15px;
}
.option:hover:not(.locked) { border-color: var(--blue); background: rgba(59,130,246,.06); box-shadow: inset 3px 0 0 rgba(59,130,246,.35); }
.option.selected { border-color: var(--blue); background: rgba(59,130,246,.09); box-shadow: inset 3px 0 0 rgba(59,130,246,.55); }
.option.correct  { border-color: var(--green); background: rgba(16,185,129,.11); box-shadow: inset 3px 0 0 rgba(16,185,129,.55); }
.option.wrong    { border-color: var(--red);   background: rgba(239,68,68,.11);  box-shadow: inset 3px 0 0 rgba(239,68,68,.55); }
.option.locked   { cursor: default; }
/* animações de feedback — só no render imediatamente após verificar */
.option.correct.anim { animation: pop .3s ease; }
.option.wrong.anim   { animation: shake .38s ease; }

.opt-ltr {
  width: 27px; height: 27px;
  border-radius: 50%;
  border: 1.5px solid var(--muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  flex-shrink: 0;
  color: var(--muted);
  transition: .15s;
  line-height: 1;
}
.option.selected .opt-ltr { border-color: var(--blue);  color: var(--blue); }
/* ✓/✗ no circle após verificação */
.option.correct  .opt-ltr { border-color: var(--green); color: var(--green); font-size: 14px; font-weight: 700; }
.option.wrong    .opt-ltr { border-color: var(--red);   color: var(--red);   font-size: 14px; font-weight: 700; }

/* ── Input Lacuna ───────────────────────────────── */
.gap-wrap { display: flex; flex-direction: column; gap: 8px; }
.gap-label { font-size: 13px; color: var(--muted); }
.gap-input {
  width: 100%; padding: 13px 15px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  color: var(--txt);
  font-size: 16px; font-family: inherit;
  outline: none;
  transition: border-color .15s;
}
.gap-input:focus   { border-color: var(--blue); }
.gap-input.correct { border-color: var(--green); background: rgba(16,185,129,.07); }
.gap-input.wrong   { border-color: var(--red);   background: rgba(239,68,68,.07); }
.gap-input:disabled { opacity: .7; }
.gap-answer-hint { font-size: 13px; color: var(--green); margin-top: 4px; display: none; }
.gap-answer-hint.show { display: block; }

/* ── Explicação ─────────────────────────────────── */
.explanation {
  margin-top: 18px; padding: 14px 17px;
  border-radius: 10px;
  border-left: 3px solid var(--blue);
  background: rgba(59,130,246,.06);
  font-size: 14px; color: #cbd5e1;
  display: none;
}
.explanation.show { display: block; animation: slideReveal .2s ease; }
.exp-res { font-weight: 800; margin-bottom: 5px; font-size: 14px; }
.exp-res.ok      { color: var(--green); }
.exp-res.bad     { color: var(--red); }
.exp-res.neutral { color: var(--muted); }

/* ── Barra de botões ────────────────────────────── */
.btn-bar {
  display: flex; gap: 9px;
  margin-top: 24px; flex-wrap: wrap;
  align-items: center;
}
.spacer { flex: 1; }
/* separador visual entre Próxima e Finalizar — evita cliques acidentais */
.btn-sep {
  width: 1px;
  align-self: stretch;
  background: var(--border);
  margin: 4px 2px;
  flex-shrink: 0;
}

button {
  padding: 12px 18px;
  border: none; border-radius: 10px;
  cursor: pointer; font-weight: 700;
  font-size: 14px; font-family: inherit;
  transition: opacity .15s, transform .1s, background .15s;
  white-space: nowrap;
}
button:active:not(:disabled) { transform: scale(.97); }
button:disabled { opacity: .4; cursor: not-allowed; }

.btn-p  { background: var(--blue); color: #fff; box-shadow: 0 2px 10px rgba(59,130,246,.3); }
.btn-p:hover:not(:disabled)  { background: var(--blue2); box-shadow: 0 4px 18px rgba(59,130,246,.45); }
.btn-s  { background: var(--surface); border: 1px solid var(--border); color: var(--txt); }
.btn-s:hover:not(:disabled)  { border-color: var(--blue); }
.btn-d  { background: #450a0a; color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
.btn-d:hover:not(:disabled)  { background: var(--red); color: #fff; }
.btn-ok { background: #052e16; color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
.btn-ok:hover:not(:disabled) { background: var(--green); color: #fff; }
/* botão Finalizar discreto — não compete com Próxima */
.btn-finish {
  background: transparent;
  border: 1px solid rgba(239,68,68,.3);
  color: #fca5a5;
  padding: 12px 13px;
  font-size: 13px;
  opacity: .7;
}
.btn-finish:hover:not(:disabled) { opacity: 1; background: #450a0a; border-color: var(--red); }

/* ── Modal ──────────────────────────────────────── */
#modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.78);
  z-index: 200; align-items: center;
  justify-content: center; padding: 20px;
}
#modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px; padding: 30px;
  max-width: 420px; width: 100%;
  box-shadow: 0 24px 80px rgba(0,0,0,.65);
  animation: fadeUp .2s ease;
}
.modal h2 { font-size: 19px; margin-bottom: 18px; }
.modal-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 11px; margin-bottom: 22px;
}
.modal-stat {
  background: var(--surface);
  border-radius: 10px; padding: 14px;
  text-align: center;
}
.modal-val { font-size: 28px; font-weight: 900; display: block; }
.modal-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
.modal-btns { display: flex; gap: 10px; }
.modal-btns button { flex: 1; }

/* ── Tela de Resultado ──────────────────────────── */
.result-hero { text-align: center; padding: 36px 0 28px; }
.result-pct {
  font-size: 88px; font-weight: 900; line-height: 1;
  background: linear-gradient(135deg, var(--blue), var(--green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.result-grade { font-size: 21px; font-weight: 700; margin-top: 10px; }
.result-lbl   { font-size: 14px; color: var(--muted); margin-top: 6px; }

.result-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
  gap: 11px; margin: 24px 0;
}
.res-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 16px;
  text-align: center;
}
.res-val { font-size: 30px; font-weight: 900; display: block; }
.res-lbl { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* pontos fortes e pontos a reforçar */
.highlights {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 14px; margin-top: 28px;
}
.hl-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px; padding: 16px;
}
.hl-box h4 {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
  margin-bottom: 10px;
}
.hl-box.good { border-color: rgba(16,185,129,.25); }
.hl-box.bad  { border-color: rgba(239,68,68,.2); }
.hl-box.good h4 { color: var(--green); }
.hl-box.bad  h4 { color: var(--red); }
.hl-item {
  font-size: 13px; color: var(--txt);
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,.05);
  display: flex; justify-content: space-between; gap: 8px;
}
.hl-item:last-child { border-bottom: none; padding-bottom: 0; }
.hl-pct { color: var(--muted); font-size: 12px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.hl-empty { font-size: 13px; color: var(--muted); font-style: italic; }

/* gráfico por categoria */
.cat-section { margin-top: 28px; }
.cat-section h3 {
  font-size: 12px; font-weight: 700;
  color: var(--muted); text-transform: uppercase;
  letter-spacing: .08em; margin-bottom: 14px;
}
.cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
.cat-name {
  width: 160px; flex-shrink: 0;
  color: var(--txt); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.cat-track {
  flex: 1; height: 7px;
  background: var(--border);
  border-radius: 999px; overflow: hidden;
}
.cat-fill { height: 100%; border-radius: 999px; transition: width .6s .15s; }
.cat-pct {
  width: 36px; text-align: right;
  color: var(--muted); font-variant-numeric: tabular-nums;
  font-size: 12px;
}

/* ── Login ──────────────────────────────────────── */
.login-form  { display: flex; flex-direction: column; gap: 14px; }
.form-group  { display: flex; flex-direction: column; gap: 5px; }
.login-err   { font-size: 13px; color: var(--red); min-height: 18px; }

/* ── Info de usuário no cabeçalho ───────────────── */
.hd-user {
  display: flex; align-items: center;
  gap: 8px; font-size: 12px; color: var(--muted);
}
.hd-user strong { color: var(--txt); font-weight: 700; }
.btn-switch {
  font-size: 11px; color: var(--muted);
  background: none; border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 8px;
  cursor: pointer; font-family: inherit;
  font-weight: 600; transition: .15s;
}
.btn-switch:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }

/* ── Tela de boas-vindas ────────────────────────── */
.welcome-info {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 22px; text-align: center; margin: 20px 0;
}
.welcome-q {
  font-size: 42px; font-weight: 900; line-height: 1;
  color: var(--txt); font-variant-numeric: tabular-nums;
}
.welcome-q span { color: var(--muted); font-weight: 400; font-size: 32px; }
.welcome-lbl {
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .07em; margin-top: 6px;
}

/* ── Modal de aviso de acesso ───────────────────── */
#notice-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#notice-overlay.open { display: flex; }

.notice-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 32px 28px 24px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 24px 80px rgba(0,0,0,.7);
  animation: fadeUp .25s ease;
  text-align: center;
}
.notice-icon  { font-size: 26px; margin-bottom: 10px; }
.notice-title {
  font-size: 13px; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--txt); margin-bottom: 18px;
}
.notice-divider { height: 1px; background: var(--border); margin: 16px 0; }
.notice-body {
  font-size: 14px; color: #cbd5e1;
  line-height: 1.75; text-align: center;
}
.notice-body p { margin-bottom: 10px; }
.notice-body p:last-child { margin-bottom: 0; }
.notice-check-row {
  display: inline-flex; align-items: center;
  gap: 8px; font-size: 13px; color: var(--muted);
  cursor: pointer; user-select: none;
  margin: 18px 0 16px;
}
.notice-check-row input[type="checkbox"] {
  width: 15px; height: 15px;
  cursor: pointer; accent-color: var(--blue);
  flex-shrink: 0;
}
.notice-footer {
  font-size: 11px; color: var(--muted);
  margin-top: 14px; letter-spacing: .03em;
}
.notice-footer strong { color: var(--txt); }

/* ── Seleção de modo ────────────────────────────── */
.mode-card {
  padding: 20px 22px;
  border: 2px solid var(--border);
  border-radius: 13px;
  cursor: pointer;
  background: var(--surface);
  transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
}
.mode-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.mode-card.exam-card:hover  { border-color: var(--blue);  background: rgba(59,130,246,.06); }
.mode-card.train-card:hover { border-color: var(--green); background: rgba(16,185,129,.06); }
.mode-card-icon  { font-size: 30px; margin-bottom: 8px; }
.mode-card-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; color: var(--txt); }
.mode-card-desc  { font-size: 13px; color: var(--muted); line-height: 1.65; }
.mode-card-tags  { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.mode-tag {
  font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 99px;
}
.exam-card  .mode-tag { border: 1px solid rgba(59,130,246,.35); color: #93c5fd; background: rgba(59,130,246,.08); }
.train-card .mode-tag { border: 1px solid rgba(16,185,129,.3);  color: #6ee7b7; background: rgba(16,185,129,.07); }

/* ── Sugestões (resultado treino) ───────────────── */
.suggestion-box {
  background: rgba(16,185,129,.05);
  border: 1px solid rgba(16,185,129,.2);
  border-radius: 10px;
  padding: 14px 16px;
  margin-top: 20px;
}
.suggestion-box h4 {
  font-size: 11px; font-weight: 700;
  color: var(--green); text-transform: uppercase;
  letter-spacing: .07em; margin-bottom: 9px;
}
.suggestion-item {
  font-size: 13px; color: #cbd5e1;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,.04);
  display: flex; align-items: baseline; gap: 7px;
}
.suggestion-item:last-child { border-bottom: none; }

/* ── Favorito ───────────────────────────────────── */
.btn-flag.fav-active {
  background: rgba(245,158,11,.14);
  border-color: var(--amber); color: var(--amber);
}

/* ── Modo Revisão ───────────────────────────────── */
.review-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700; color: var(--amber);
  background: rgba(245,158,11,.1);
  border: 1px solid rgba(245,158,11,.28);
  border-radius: 99px; padding: 2px 9px;
  white-space: nowrap;
}
/* card de revisão na home */
.review-card {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  background: rgba(245,158,11,.05);
  border: 1.5px solid rgba(245,158,11,.22);
  border-radius: 11px; cursor: pointer;
  transition: border-color .15s, background .15s, transform .15s;
  margin-top: 11px;
}
.review-card:hover { border-color: var(--amber); background: rgba(245,158,11,.1); transform: translateY(-1px); }
.review-card-left  { display: flex; align-items: center; gap: 12px; }
.review-card-count { font-size: 22px; font-weight: 900; color: var(--amber); }

/* ── Seleção de matéria ─────────────────────────── */
.home-opt.has-saved { border-color: rgba(16,185,129,.35); }
.home-opt.has-saved:hover { border-color: var(--green); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.subject-badge {
  margin-left: auto; flex-shrink: 0;
  font-size: 11px; font-weight: 700;
  color: var(--green);
  background: rgba(16,185,129,.1);
  border: 1px solid rgba(16,185,129,.3);
  border-radius: 99px; padding: 3px 10px;
  white-space: nowrap;
}
.subject-empty {
  font-size: 12px; color: var(--muted);
  margin-top: 14px; text-align: center;
  padding: 12px; border: 1px dashed var(--border);
  border-radius: 8px;
}

/* ── Botão fixo — Biblioteca ────────────────────── */
#lib-btn-wrap {
  display: none;
  position: fixed;
  bottom: 22px;
  left: 20px;
  z-index: 150;
}
#lib-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--muted);
  padding: 9px 14px;
  font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 2px 14px rgba(0,0,0,.45);
  transition: border-color .15s, color .15s, background .15s, box-shadow .15s;
  white-space: nowrap;
}
#lib-btn:hover {
  border-color: var(--blue);
  color: var(--txt);
  background: var(--card);
  box-shadow: 0 4px 20px rgba(0,0,0,.5);
}
#lib-btn-wrap.visible { display: block; }

/* ── Gerenciar matérias ─────────────────────────── */
.manage-row {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}
.manage-row:last-child { border-bottom: none; }
.manage-row-info  { flex: 1; min-width: 0; }
.manage-row-title { font-size: 14px; font-weight: 700; color: var(--txt); }
.manage-row-meta  { font-size: 12px; color: var(--muted); margin-top: 2px; }
.manage-row-btns  { display: flex; gap: 6px; flex-shrink: 0; }

/* ── Responsivo ─────────────────────────────────── */
@media (max-width: 600px) {
  .card { padding: 18px; }
  .q-text { font-size: 16px; }
  button  { padding: 11px 13px; font-size: 13px; }
  .result-pct { font-size: 64px; }
  .cat-name { width: 110px; }
  .hd-brand { font-size: 11px; }
  .highlights { grid-template-columns: 1fr; }
}
@media (max-width: 400px) {
  .btn-sep { display: none; }
  .btn-bar { gap: 6px; }
  .stats-row { gap: 10px; font-size: 11px; }
  .stat-pct { font-size: 12px; }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmt(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return h > 0
    ? `${h}:${pad(m)}:${pad(s)}`
    : `${pad(m)}:${pad(s)}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

/* Escapa HTML para evitar XSS ao inserir texto de questões */
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

/* ═══════════════════════════════════════════════════
   INDEXEDDB — bancos customizados
   ═══════════════════════════════════════════════════ */
let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) { resolve(_db); return; }
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('subjects'))
        d.createObjectStore('subjects', { keyPath: 'key' });
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror   = e => reject(e.target.error);
  });
}

async function loadCustomSubjects() {
  try {
    const d = await openDB();
    return new Promise(res => {
      const req = d.transaction('subjects','readonly').objectStore('subjects').getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror   = () => res([]);
    });
  } catch(_) { return []; }
}

async function saveSubjectToDB(subj) {
  const d = await openDB();
  return new Promise((res, rej) => {
    const req = d.transaction('subjects','readwrite').objectStore('subjects').put(subj);
    req.onsuccess = () => res();
    req.onerror   = () => rej(req.error);
  });
}

async function deleteSubjectFromDB(key) {
  try {
    const d = await openDB();
    return new Promise(res => {
      const req = d.transaction('subjects','readwrite').objectStore('subjects').delete(key);
      req.onsuccess = () => res();
      req.onerror   = () => res();
    });
  } catch(_) {}
}

let _pendingImport = null;

/* Valida e normaliza array de questões brutas */
function parseQuestions(raw) {
  let data;
  try { data = JSON.parse(raw); }
  catch(_) { return { valid: [], invalid: 0, error: 'JSON inválido ou formato não suportado.' }; }

  if (!Array.isArray(data)) {
    if (data && Array.isArray(data.questions)) data = data.questions;
    else return { valid: [], invalid: 0, error: 'O JSON deve ser um array de questões.' };
  }

  const valid = []; let invalid = 0;
  data.forEach(q => {
    if (!q || typeof q !== 'object' || !q.question) { invalid++; return; }
    const type = String(q.type || 'mc').toLowerCase();
    if (!['mc','gap','tf','disc'].includes(type)) { invalid++; return; }
    if (type === 'mc') {
      if (!Array.isArray(q.options) || q.options.length < 2) { invalid++; return; }
      if (typeof q.correct !== 'number' || q.correct < 0 || q.correct >= q.options.length) { invalid++; return; }
    }
    if ((type === 'gap' || type === 'tf') && (q.correct === undefined || q.correct === '')) { invalid++; return; }
    valid.push({
      type, question: String(q.question).trim(),
      category: q.category || 'Geral', options: q.options || [],
      correct: q.correct, explanation: q.explanation || '',
    });
  });
  return { valid, invalid };
}

/* Lê File do sistema e retorna resultado parseado */
function importQuestions(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload  = e => res({ ...parseQuestions(e.target.result), fileName: file.name });
    r.onerror = () => res({ valid: [], invalid: 0, error: 'Erro ao ler arquivo.' });
    r.readAsText(file, 'utf-8');
  });
}

/* ═══════════════════════════════════════════════════
   PERSISTÊNCIA (localStorage)
   ═══════════════════════════════════════════════════ */
const KEY = 'cia_sim_v3';

function save() {
  if (S.phase !== 'quiz') return;
  try {
    localStorage.setItem(KEY, JSON.stringify({
      deck: S.deck, answers: S.answers,
      validated: S.validated, flagged: S.flagged,
      mode: S.mode, idx: S.idx, timer: S.timer,
      userName:  S.userName,
      startedAt: S.startedAt,
      subject:   S.subject || 'cia',
      ts: Date.now()
    }));
  } catch(_) {}
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (Date.now() - p.ts > 86400000) { localStorage.removeItem(KEY); return null; }
    /* ignorar progresso de outro usuário */
    if (p.userName && S.userName && p.userName !== S.userName) return null;
    /* ignorar progresso de outra matéria (salvo=undefined → trata como 'cia') */
    const pSubject = p.subject || 'cia';
    if (S.subject && pSubject !== S.subject) return null;
    return p;
  } catch(_) { return null; }
}

function clearSave() {
  try { localStorage.removeItem(KEY); } catch(_) {}
}

/* Salva apenas progresso de simulado normal (não revisão) */
function saveProgress() {
  if (S.phase === 'quiz' && !S.reviewMode) save();
}

/* Retorna progresso salvo para a matéria ativa (ou null) */
function restoreProgress() {
  return loadSaved();
}

  try { return JSON.parse(localStorage.getItem(REVIEW_KEY)) || []; } catch(_) { return []; }
}
function saveReview(q) {
  try { localStorage.setItem(REVIEW_KEY, JSON.stringify(q)); } catch(_) {}
}

/* addToReview — cria ou atualiza entrada; reason: 'wrong'|'flag' */
function addToReview(q, subj) {
  const id    = q._id || q.question;
  const queue = loadReview();
  const hit   = queue.find(r => r.questionId === id && r.subject === subj);
  if (hit) {
    hit.mistakes++;
    hit.lastSeen = Date.now();
    hit.status   = 'pending';
    delete hit.doneAt;
  } else {
    queue.push({ subject: subj, questionId: id, lastSeen: Date.now(), mistakes: 1, status: 'pending' });
  }
  saveReview(queue);
}

/* removeFromReview — marca como concluída */
function removeFromReview(q, subj) {
  const id    = q._id || q.question;
  const queue = loadReview();
  const hit   = queue.find(r => r.questionId === id && r.subject === subj);
  if (hit) { hit.status = 'done'; hit.doneAt = Date.now(); saveReview(queue); }
}

function getPendingReview(subj) {
  return loadReview().filter(r => r.subject === subj && r.status === 'pending');
}

function getTodayDone(subj) {
  const start = new Date(); start.setHours(0,0,0,0);
  return loadReview().filter(r => r.subject === subj && r.status === 'done' && r.doneAt >= start.getTime()).length;
}

/* ═══════════════════════════════════════════════════
   FAVORITOS
   ═══════════════════════════════════════════════════ */
function loadFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(_) { return []; }
}
function isFav(q, subj) {
  const id = q._id || q.question;
  return loadFavs().includes(`${subj}::${id}`);
}
function toggleFav(q, subj) {
  const id   = `${subj}::${(q._id || q.question)}`;
  const favs = loadFavs();
  const idx  = favs.indexOf(id);
  idx >= 0 ? favs.splice(idx, 1) : favs.push(id);
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(_) {}
  return idx < 0;
}

/* ═══════════════════════════════════════════════════
   PREPARAÇÃO DO DECK — aceita fonte opcional para revisar erros
   ═══════════════════════════════════════════════════ */
function prepareDeck(source) {
  return shuffle(source || ACTIVE_QUESTIONS).map(q => {
    const base = { ...q, _id: q._id || q.question };
    if (q.type === 'mc') {
      const idxs = shuffle([0,1,2,3]);
      return {
        ...base,
        shuffledOptions: idxs.map(i => q.options[i]),
        shuffledCorrect: idxs.indexOf(q.correct),
      };
    }
    return base;
  });
}

/* ═══════════════════════════════════════════════════
   TIMER
   ═══════════════════════════════════════════════════ */
function updateTimerColor(sec) {
  const el = $('timer');
  if (!el) return;
  el.classList.toggle('warn', sec >= 1800 && sec < 3600);
  el.classList.toggle('crit', sec >= 3600);
}

function startTimer() {
  stopTimer();
  S.timerRef = setInterval(() => {
    S.timer++;
    const el = $('timer');
    if (el) el.textContent = fmt(S.timer);
    updateTimerColor(S.timer);
    if (S.timer % 30 === 0) save();
  }, 1000);
}
function stopTimer() {
  if (S.timerRef) { clearInterval(S.timerRef); S.timerRef = null; }
}

/* ═══════════════════════════════════════════════════
   ESTATÍSTICAS
   ═══════════════════════════════════════════════════ */
function isCorrectAt(i) {
  const q = S.deck[i];
  const a = S.answers[i];
  if (!S.validated[i] || a === undefined) return null;
  return q.type === 'mc'
    ? a === q.shuffledCorrect
    : String(a).trim().toLowerCase() === String(q.correct).trim().toLowerCase();
}

function stats() {
  let correct = 0, wrong = 0, unanswered = 0, flagged = 0;
  S.deck.forEach((_, i) => {
    if (S.flagged[i]) flagged++;
    const r = isCorrectAt(i);
    if (r === null) unanswered++;
    else if (r) correct++;
    else wrong++;
  });
  const answered = correct + wrong;
  const pct = answered ? Math.round(correct / answered * 100) : 0;
  return { correct, wrong, unanswered, flagged, answered, total: S.deck.length, pct };
}

function catStats() {
  const map = {};
  S.deck.forEach((q, i) => {
    if (!S.validated[i]) return;
    const c = q.category;
    if (!map[c]) map[c] = { correct: 0, total: 0 };
    map[c].total++;
    if (isCorrectAt(i)) map[c].correct++;
  });
  return Object.entries(map)
    .map(([name, d]) => ({ name, ...d, pct: Math.round(d.correct / d.total * 100) }))
    .sort((a, b) => b.total - a.total);
}

function renderHeader() {

  const srow    = $('stats-row');
  const timerEl = $('timer');
  const uinfo   = $('user-info');

  if (uinfo) {

      ? `<strong>${esc(S.userName)}</strong>
         <button class="btn-switch" onclick="App.switchUser()">Trocar usuário</button>`

  /* matéria atual abaixo do brand */

  if (subjNameEl) {
    const inSession = ['quiz','review','result','home','modeselect'].includes(S.phase);
    subjNameEl.textContent = (inSession && S.subject && SUBJECTS[S.subject])
      ? SUBJECTS[S.subject].label : '';

  /* botão Biblioteca: visível durante simulado, revisão e resultado */

  }

    srow.innerHTML      = '';
    timerEl.textContent = '';

  fill.style.width    = pct + '%';
  counter.textContent = `${S.idx + 1} / ${S.deck.length}`;

}

/* ═══════════════════════════════════════════════════
   RENDER — QUESTÃO
   ═══════════════════════════════════════════════════ */
function renderQuestion() {
  S.phase = 'quiz';
  const q     = S.deck[S.idx];
  const val   = S.validated[S.idx];
  const flag  = S.flagged[S.idx];
  const ans   = S.answers[S.idx];
  const study = S.mode === 'study';

  /* consumir flags de animação antes de construir o HTML */
  const entering      = S.entering;      S.entering      = false;
  const justValidated = S.justValidated; S.justValidated = false;

  /* — corpo: opções MC ou input de lacuna — */
  let bodyHTML = '';

  if (q.type === 'mc') {
    const ltrs = ['A','B','C','D'];
    bodyHTML = '<div class="options">' +
      q.shuffledOptions.map((opt, i) => {
        let cls = 'option';
        let sym = ltrs[i];  // símbolo no círculo
        if (val) {
          cls += ' locked';
          if (i === q.shuffledCorrect) { cls += ' correct'; sym = '✓'; }
          else if (ans === i)          { cls += ' wrong';   sym = '✗'; }
          /* anima apenas no render imediatamente após verificar */
          if (justValidated && (i === q.shuffledCorrect || ans === i)) cls += ' anim';
        } else if (ans === i) {
          cls += ' selected';
        }
        const click = val ? '' : `onclick="App.pick(${i})"`;
        return `<div class="${cls}" ${click}>
          <span class="opt-ltr">${sym}</span>${esc(opt)}
        </div>`;
      }).join('') + '</div>';

  } else {
    let inputCls = 'gap-input';
    let hint     = '';
    if (val) {
      const ok = isCorrectAt(S.idx);
      inputCls += ok ? ' correct' : ' wrong';
      if (!ok && study) {
        hint = `<div class="gap-answer-hint show">✓ Resposta esperada: <strong>${esc(q.correct)}</strong></div>`;
      }
    }
    bodyHTML = `<div class="gap-wrap">
      <div class="gap-label">Digite a palavra ou expressão que completa a frase:</div>
      <input type="text" id="gap-input" class="${inputCls}"
        value="${val ? esc(String(ans ?? '')) : ''}"
        ${val ? 'disabled' : ''}
        placeholder="Sua resposta..."
        oninput="App.typeGap(this.value)"
        onkeydown="if(event.key==='Enter')App.verify()"
      />
      ${hint}
    </div>`;
  }

  /* — explicação — */
  let expHTML = '';
  if (val) {
    const ok = isCorrectAt(S.idx);
    if (study) {
      expHTML = `<div class="explanation show">
        <div class="exp-res ${ok ? 'ok' : 'bad'}">${ok ? '✅ Correto!' : '❌ Incorreto'}</div>
        ${esc(q.explanation)}
      </div>`;
    } else {
      expHTML = `<div class="explanation show">
        <div class="exp-res neutral">✓ Verificado (resultado no final)</div>
      </div>`;
    }
  }

  /* — botões de navegação — */
  const canVerify = ans !== undefined && ans !== '' && !val;
  const isLast    = S.idx === S.deck.length - 1;

  /* Na última questão o botão de avanço vira CTA verde de resultado */
  const nextBtn = isLast
    ? `<button class="btn-ok" onclick="App.confirmFinish()">🏁 Ver Resultado</button>`
    : `<button class="btn-s"  onclick="App.nav(1)">Próxima ➜</button>`;

  /* Botão Finalizar discreto só aparece quando não é a última questão */
  const finishBtn = isLast ? '' :
    `<div class="btn-sep"></div>
     <button class="btn-finish" onclick="App.confirmFinish()" title="Encerrar simulado agora">🏁</button>`;

  $('app').innerHTML = `
    <div class="card${entering ? ' entering' : ''}">
      <div class="q-hd">
        <span class="q-tag">${esc(q.category)}</span>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn-flag ${isFav(q, S.subject||'cia') ? 'fav-active' : ''}"
            onclick="App.toggleFavorite()" title="Favoritar">
            ${isFav(q, S.subject||'cia') ? '⭐' : '☆'}
          </button>
          <button class="btn-flag ${flag ? 'flagged' : ''}" onclick="App.toggleFlag()" title="Marcar para revisão">
            ${flag ? '🚩 Marcada' : '⚑ Marcar'}
          </button>
        </div>
      </div>
      <div class="q-text">${esc(q.question)}</div>
      ${bodyHTML}
      ${expHTML}
      <div class="btn-bar">
        <button class="btn-s" onclick="App.nav(-1)" ${S.idx===0?'disabled':''}>⬅ Anterior</button>
        <button class="${val ? 'btn-s' : 'btn-p'}" onclick="App.verify()" ${!canVerify?'disabled':''}>
          ${val ? '✓ Verificado' : '✔ Verificar'}
        </button>
        <span class="spacer"></span>
        ${nextBtn}
        ${finishBtn}
      </div>
    </div>
  `;

  renderHeader();
}

/* ═══════════════════════════════════════════════════
   RENDER — RESULTADO FINAL
   ═══════════════════════════════════════════════════ */
function renderResult() {
  S.phase = 'result';
  stopTimer();
  clearSave();
  renderHeader();

  const st   = stats();
  const cs   = catStats();
  const pct  = Math.round(st.correct / st.total * 100);
  const time = fmt(S.timer);

  let grade, gc;
  if (pct >= 90)      { grade = 'Excelente! 🏆';           gc = '#10b981'; }
  else if (pct >= 70) { grade = 'Aprovado ✅';             gc = '#3b82f6'; }
  else if (pct >= 50) { grade = 'Regular — continue! ⚠️'; gc = '#f59e0b'; }
  else                { grade = 'Precisa reforçar ❌';     gc = '#ef4444'; }

  /* barras por categoria */
  const catHTML = cs.map(c => {
    const color = c.pct >= 70 ? '#10b981' : c.pct >= 50 ? '#f59e0b' : '#ef4444';
    return `<div class="cat-row">
      <span class="cat-name" title="${esc(c.name)}">${esc(c.name)}</span>
      <div class="cat-track">
        <div class="cat-fill" style="width:${c.pct}%;background:${color}"></div>
      </div>
      <span class="cat-pct">${c.pct}%</span>
    </div>`;
  }).join('');

  /* pontos fortes (>=70%) e pontos fracos (<50%) com mínimo 2 questões respondidas */
  const strong = cs.filter(c => c.pct >= 70 && c.total >= 2);
  const weak   = cs.filter(c => c.pct <  50 && c.total >= 2);

  const strongHTML = strong.length
    ? strong.map(c => `<div class="hl-item"><span>${esc(c.name)}</span><span class="hl-pct">${c.pct}%</span></div>`).join('')
    : `<div class="hl-empty">Nenhuma categoria com domínio alto ainda</div>`;

  const weakHTML = weak.length
    ? weak.map(c => `<div class="hl-item"><span>${esc(c.name)}</span><span class="hl-pct">${c.pct}%</span></div>`).join('')
    : `<div class="hl-empty">Sem categorias críticas — bom trabalho!</div>`;

  /* label de modo */
  const modeLabel = S.mode === 'exam'
    ? `<span class="review-pill" style="border-color:rgba(59,130,246,.35);color:#93c5fd;background:rgba(59,130,246,.1)">🎯 Modo Prova</span>`
    : `<span class="review-pill" style="border-color:rgba(16,185,129,.3);color:#6ee7b7;background:rgba(16,185,129,.07)">📚 Modo Treino</span>`;

  /* sugestões exclusivas do modo treino */
  const trainingExtra = S.mode === 'study' ? (() => {
    const pendingNow = getPendingReview(S.subject || 'cia').length;
    const tips = weak.slice(0, 3).map(c =>
      `<div class="suggestion-item"><span>→</span> Revisar <strong>${esc(c.name)}</strong> (${c.pct}% de acerto)</div>`
    ).join('');
    return `<div class="suggestion-box">
      <h4>📋 Próximos passos</h4>
      ${pendingNow > 0
        ? `<div class="suggestion-item"><span>🔁</span> <strong>${pendingNow}</strong> questões na fila de revisão</div>`
        : ''}
      ${tips || (pendingNow === 0 ? '<div class="suggestion-item"><span>✅</span> Boa performance! Continue praticando.</div>' : '')}
    </div>`;
  })() : '';

  $('app').innerHTML = `
    <div class="card entering">
      <div class="result-hero">
        <div class="result-session-label">Sessão Concluída</div>
        <div class="result-pct">${pct}%</div>
        <div class="result-grade" style="color:${gc}">${grade}</div>
        <div class="result-lbl">${st.correct} de ${st.total} questões &bull; ${time}</div>
        <div style="margin-top:10px">${modeLabel}</div>
      </div>

      <div class="result-grid">
        <div class="res-stat">
          <span class="res-val" style="color:var(--green)">${st.correct}</span>
          <div class="res-lbl">Acertos</div>
        </div>
        <div class="res-stat">
          <span class="res-val" style="color:var(--red)">${st.wrong}</span>
          <div class="res-lbl">Erros</div>
        </div>
        <div class="res-stat">
          <span class="res-val" style="color:var(--muted)">${st.unanswered}</span>
          <div class="res-lbl">Não respondidas</div>
        </div>
        <div class="res-stat">
          <span class="res-val" style="color:var(--blue)">${time}</span>
          <div class="res-lbl">Tempo total</div>
        </div>
      </div>

      <div class="highlights">
        <div class="hl-box good">
          <h4>✦ Pontos Fortes</h4>
          ${strongHTML}
        </div>
        <div class="hl-box bad">
          <h4>✦ Pontos a Reforçar</h4>
          ${weakHTML}
        </div>
      </div>

      ${trainingExtra}

      ${cs.length ? `<div class="cat-section"><h3>Desempenho por Categoria</h3>${catHTML}</div>` : ''}

      <div class="btn-bar" style="margin-top:28px;flex-wrap:wrap">
        ${S.reviewMode
          ? `<button class="btn-p" onclick="App.goReview()">🔁 Voltar à Revisão</button>
             <button class="btn-s" onclick="App.restart()">🏠 Início</button>`
          : `<button class="btn-p" onclick="App.restart()">🔄 Novo Simulado</button>
             ${st.wrong > 0 ? `<button class="btn-s" onclick="App.reviewWrong()">📋 Revisar Erros (${st.wrong})</button>` : ''}`
        }
        <button class="btn-s" onclick="App.exportJSON()">⬇ Exportar JSON</button>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════ */
function showModal(html) {
  $('modal-box').innerHTML = html;
  $('modal-overlay').classList.add('open');
}
function hideModal() {
  $('modal-overlay').classList.remove('open');
}

/* ═══════════════════════════════════════════════════
   CONTROLADOR PRINCIPAL
   ═══════════════════════════════════════════════════ */
const App = {

  /* ── Importação ──────────────────────────────── */
  openImport() {
    const inp = $('import-file-input');
    if (inp) inp.click();
  },

  async handleImportFile(file) {
    if (!file) return;
    const result = await importQuestions(file);
    if (result.error) {
      showModal(`<h2>⚠️ Erro na Importação</h2>
        <p style="font-size:14px;color:var(--muted);margin:12px 0">${esc(result.error)}</p>
        <div class="modal-btns"><button class="btn-p" onclick="hideModal()">OK</button></div>`);
      return;
    }
    _pendingImport = result;
    const nameDefault = file.name.replace(/\.(json|txt)$/i,'').replace(/[_\-]/g,' ');
    const types = [...new Set(result.valid.map(q => q.type.toUpperCase()))].join(', ');
    showModal(`
      <h2>📥 Importar Matéria</h2>
      <div class="form-group" style="margin-bottom:10px">
        <label class="gap-label">Nome da matéria</label>
        <input type="text" id="import-name" class="gap-input"
          value="${esc(nameDefault)}" placeholder="Ex: Navegação Avançada"
          onkeydown="if(event.key==='Enter')App.confirmImport()">
      </div>
      <div style="display:flex;gap:10px;margin-bottom:14px">
        <div class="form-group" style="flex:0 0 80px">
          <label class="gap-label">Ícone</label>
          <input type="text" id="import-icon" class="gap-input"
            value="📗" style="font-size:20px;text-align:center;padding:8px">
        </div>
        <div class="modal-grid" style="flex:1;margin:0;align-content:end">
          <div class="modal-stat">
            <span class="modal-val" style="color:var(--green)">${result.valid.length}</span>
            <div class="modal-lbl">Importadas</div>
          </div>
          <div class="modal-stat">
            <span class="modal-val" style="color:${result.invalid>0?'var(--red)':'var(--muted)'}">${result.invalid}</span>
            <div class="modal-lbl">Ignoradas</div>
          </div>
        </div>
      </div>
      ${types ? `<div style="font-size:12px;color:var(--muted);margin-bottom:14px">Tipos encontrados: ${esc(types)}</div>` : ''}
      ${result.valid.length===0 ? `<div class="login-err">Nenhuma questão válida encontrada.</div>` : ''}
      <div class="modal-btns">
        <button class="btn-s" onclick="hideModal()">Cancelar</button>
        ${result.valid.length>0
          ? `<button class="btn-p" onclick="App.confirmImport()">✓ Confirmar (${result.valid.length})</button>`
          : ''}
      </div>`);
    setTimeout(() => { const el=$('import-name'); if(el) el.select(); }, 60);
  },

  async confirmImport() {
    if (!_pendingImport) return;
    const nameEl = $('import-name');
    const iconEl = $('import-icon');
    const name   = nameEl ? nameEl.value.trim() : 'Matéria Importada';
    const icon   = iconEl ? (iconEl.value.trim() || '📗') : '📗';
    if (!name) { if (nameEl) nameEl.focus(); return; }
    const key = makeSubjectKey(name);
    hideModal();
    await createSubject(key, name, icon, _pendingImport.valid);
    _pendingImport = null;
    App.selectSubject(key);
  },

  /* ── Gerenciamento ────────────────────────────── */
  goManageSubjects() { renderManageSubjects(); },

  async editSubjectName(key) {
    const s = SUBJECTS[key];
    if (!s || !s.isCustom) return;
    showModal(`
      <h2>✏️ Editar Matéria</h2>
      <div class="form-group" style="margin-bottom:10px">
        <label class="gap-label">Nome</label>
        <input type="text" id="edit-name" class="gap-input" value="${esc(s.title)}"
          onkeydown="if(event.key==='Enter')App.applyEditName('${key}')">
      </div>
      <div class="form-group" style="margin-bottom:14px">
        <label class="gap-label">Ícone</label>
        <input type="text" id="edit-icon" class="gap-input"
          value="${esc(s.icon)}" style="width:70px;font-size:20px;text-align:center;padding:8px">
      </div>
      <div class="modal-btns">
        <button class="btn-s" onclick="hideModal()">Cancelar</button>
        <button class="btn-p" onclick="App.applyEditName('${key}')">Salvar</button>
      </div>`);
    setTimeout(() => { const el=$('edit-name'); if(el){el.select();} }, 60);
  },

  async applyEditName(key) {
    const s    = SUBJECTS[key];
    const name = ($('edit-name')||{}).value?.trim();
    const icon = ($('edit-icon')||{}).value?.trim() || s.icon;
    if (!name || !s) return;
    s.title = name; s.label = name; s.icon = icon;
    await saveSubjectToDB(s);
    hideModal();
    renderManageSubjects();
  },

  async duplicateSubject(key) {
    const src = SUBJECTS[key];
    if (!src) return;
    const newKey = makeSubjectKey(src.title + '_copia');
    await createSubject(newKey, src.title + ' (Cópia)', src.icon, src.questions);
    renderManageSubjects();
  },

  async deleteSubject(key) {
    const s = SUBJECTS[key];
    if (!s || !s.isCustom) return;
    showModal(`
      <h2>🗑 Excluir Matéria?</h2>
      <p style="font-size:14px;color:var(--muted);margin:12px 0">
        <strong>${esc(s.title)}</strong> (${s.questions.length} questões) será removida permanentemente.
      </p>
      <div class="modal-btns">
        <button class="btn-p" onclick="hideModal()">Cancelar</button>
        <button class="btn-d" onclick="App.confirmDeleteSubject('${key}')">Excluir</button>
      </div>`);
  },

  async confirmDeleteSubject(key) {
    await deleteSubjectFromDB(key);
    delete SUBJECTS[key];
    hideModal();
    renderManageSubjects();
  },

  /* navegar para seleção de modo */
  /* navegar para Biblioteca com confirmação e salvamento */
  goLibrary() {
    showModal(`
      <h2>🏠 Voltar para Biblioteca?</h2>
      <p style="font-size:14px;color:var(--muted);margin:12px 0">
        Seu progresso será salvo e você poderá continuar depois.
      </p>
      <div class="modal-btns">
        <button class="btn-s" onclick="hideModal()">Cancelar</button>
        <button class="btn-p" onclick="App.confirmGoLibrary()">Voltar</button>
      </div>
    `);
  },

  confirmGoLibrary() {
    hideModal();
    saveProgress();   // salva quiz normal; no-op em revisão e resultado
    stopTimer();
    S.reviewMode = false;
    renderSubjects();
  },

  goModeSelect() { renderModeSelect(); },

  /* iniciar em Modo Prova */
  startExam() {
    S.mode = 'exam';
    this.startNew();
  },

  /* iniciar em Modo Treino */
  startTraining() {
    S.mode = 'study';
    this.startNew();
  },

  /* encerrar sessão respeitando o modo ativo */
  finishSession() {
    hideModal();
    renderResult();
  },
  finishExam()     { S.mode = 'exam';  this.finishSession(); },
  finishTraining() { S.mode = 'study'; this.finishSession(); },

  /* validar credenciais e entrar */
  doLogin() {
    const nameEl = $('login-name');
    const keyEl  = $('login-key');
    const errEl  = $('login-err');
    const name = nameEl ? nameEl.value.trim() : '';
    const key  = keyEl  ? keyEl.value.trim().toUpperCase() : '';

    const canonical = CREDENTIALS[key];
    if (!canonical || name.toLowerCase() !== canonical.toLowerCase()) {
      if (errEl) errEl.textContent = 'Nome ou chave incorretos.';
      if (keyEl) { keyEl.value = ''; keyEl.focus(); }
      return;
    }

    S.userName = canonical;
    setUser(canonical);

    showAccessNotice(() => {
      renderSubjects();
    });
  },

  /* selecionar matéria e ir para home ou boas-vindas */
  selectSubject(key) {
    if (!SUBJECTS[key]) return;
    S.subject        = key;
    ACTIVE_QUESTIONS = SUBJECTS[key].questions;
    try { localStorage.setItem(SUBJECT_KEY, key); } catch(_) {}
    const saved = loadSaved();
    if (saved) {
      renderWelcome(saved);
    } else {
      renderHome();
    }
  },

  /* voltar à seleção de matéria */
  goSubjects() {
    stopTimer();
    renderSubjects();
  },

  /* encerrar sessão e voltar ao login */
  switchUser() {
    clearUser(); // limpa localStorage de usuário e progresso, chama renderLogin
  },

  setMode(m) {
    S.mode = m;
    const os = $('opt-study'), oe = $('opt-exam');
    if (os) os.classList.toggle('active', m === 'study');
    if (oe) oe.classList.toggle('active', m === 'exam');
  },

  startNew() {
    clearSave();
    S.reviewMode = false;
    S.deck      = prepareDeck();
    S.answers   = Array(S.deck.length).fill(undefined);
    S.validated = Array(S.deck.length).fill(false);
    S.flagged   = Array(S.deck.length).fill(false);
    S.idx       = 0;
    S.timer     = 0;
    S.startedAt = Date.now();
    S.entering  = true;
    syncBadge();
    startTimer();
    renderQuestion();
  },

  /* iniciar sessão de revisão a partir dos pendentes */
  startReview() {
    const subj    = S.subject || 'cia';
    const pending = getPendingReview(subj);
    if (!pending.length) return;
    const allQ    = SUBJECTS[subj]?.questions || [];
    const revQ    = pending
      .map(r => allQ.find(q => q.question === r.questionId))
      .filter(Boolean);
    if (!revQ.length) return;

    stopTimer();
    clearSave();
    S.reviewMode = true;
    S.deck       = prepareDeck(revQ);
    S.answers    = Array(S.deck.length).fill(undefined);
    S.validated  = Array(S.deck.length).fill(false);
    S.flagged    = Array(S.deck.length).fill(false);
    S.idx        = 0;
    S.timer      = 0;
    S.entering   = true;
    startTimer();
    renderQuestion();
  },

  /* ir para a tela de revisão da matéria atual */
  goReview() {
    stopTimer();
    S.reviewMode = false;
    renderReview();
  },

  /* ir para o início da matéria atual */
  goHome() {
    stopTimer();
    S.reviewMode = false;
    clearSave();
    S.mode = 'study';
    renderHome();
  },

  continueSaved() {
    const p = loadSaved();
    if (!p) { this.startNew(); return; }
    Object.assign(S, {
      deck: p.deck, answers: p.answers,
      validated: p.validated, flagged: p.flagged,
      mode: p.mode, idx: p.idx, timer: p.timer,
      startedAt: p.startedAt || Date.now(),
    });
    S.entering = true;
    syncBadge();
    startTimer();
    renderQuestion();
  },

  /* selecionar opção MC */
  pick(i) {
    if (S.validated[S.idx]) return;
    S.answers[S.idx] = i;
    renderQuestion();
  },

  /* digitar em lacuna */
  typeGap(v) {
    S.answers[S.idx] = v;
  },

  /* verificar resposta */
  verify() {
    if (S.validated[S.idx]) return;
    const q = S.deck[S.idx];
    if (q.type === 'gap') {
      const inp = $('gap-input');
      if (inp) S.answers[S.idx] = inp.value;
    }
    if (S.answers[S.idx] === undefined || S.answers[S.idx] === '') return;
    S.validated[S.idx] = true;
    S.justValidated    = true;
    save();

    const subj = S.subject || 'cia';
    const ok   = isCorrectAt(S.idx);
    if (S.reviewMode) {
      /* em revisão: acertou sem flag → remove da fila; caso contrário → mantém */
      if (ok === true && !S.flagged[S.idx]) removeFromReview(q, subj);
      else addToReview(q, subj);
    } else {
      /* simulado normal: errou → adiciona à fila */
      if (ok === false) addToReview(q, subj);
    }
    renderQuestion();
  },

  /* navegar entre questões */
  nav(dir) {
    const next = S.idx + dir;
    if (next < 0 || next >= S.deck.length) return;
    S.idx      = next;
    S.entering = true;
    save();
    renderQuestion();
  },

  toggleFlag() {
    S.flagged[S.idx] = !S.flagged[S.idx];
    const subj = S.subject || 'cia';
    /* marcar → adiciona à fila; desmarcar no modo revisão → remove da fila */
    if (S.flagged[S.idx]) {
      addToReview(S.deck[S.idx], subj);
    } else if (S.reviewMode) {
      removeFromReview(S.deck[S.idx], subj);
    }
    save();
    renderQuestion();
  },

  toggleFavorite() {
    const q    = S.deck[S.idx];
    const subj = S.subject || 'cia';
    toggleFav(q, subj);
    renderQuestion();
  },

  toggleMode() {
    if (S.phase !== 'quiz') return;
    S.mode = S.mode === 'study' ? 'exam' : 'study';
    syncBadge();
    renderQuestion();
  },

  /* modal de confirmação antes de finalizar — ação segura é primária */
  confirmFinish() {
    const st = stats();
    showModal(`
      <h2>🏁 Finalizar Sessão?</h2>
      <div class="modal-grid">
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--green)">${st.correct}</span>
          <div class="modal-lbl">Acertos</div>
        </div>
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--red)">${st.wrong}</span>
          <div class="modal-lbl">Erros</div>
        </div>
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--muted)">${st.unanswered}</span>
          <div class="modal-lbl">Não respondidas</div>
        </div>
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--blue)">${st.answered ? st.pct + '%' : '—'}</span>
          <div class="modal-lbl">Aproveitamento parcial</div>
        </div>
      </div>
      <div class="modal-btns">
        <button class="btn-p" onclick="hideModal()">⬅ Continuar</button>
        <button class="btn-d" onclick="App.finishSession()">Finalizar agora</button>
      </div>
    `);
  },

  /* deck de revisão com opções re-embaralhadas */
  reviewWrong() {
    const wrong = S.deck.filter((_, i) => isCorrectAt(i) === false);
    if (!wrong.length) return;
    S.deck      = prepareDeck(wrong);
    S.answers   = Array(S.deck.length).fill(undefined);
    S.validated = Array(S.deck.length).fill(false);
    S.flagged   = Array(S.deck.length).fill(false);
    S.idx       = 0;
    S.timer     = 0;
    S.phase     = 'quiz';
    S.entering  = true;
    startTimer();
    renderQuestion();
  },

  restart() {
    stopTimer();
    clearSave();
    S.mode       = 'study';
    S.reviewMode = false;
    renderHome();
  },

  exportJSON() {
    const st = stats();
    const data = {
      data: new Date().toISOString(),
      pontuacao: st.pct + '%',
      acertos: st.correct, erros: st.wrong,
      nao_respondidas: st.unanswered, total: st.total,
      tempo: fmt(S.timer), modo: S.mode,
      categorias: catStats(),
      detalhes: S.deck.map((q, i) => ({
        categoria: q.category,
        questao: q.question,
        verificada: S.validated[i],
        correta: isCorrectAt(i),
        marcada: S.flagged[i],
      })),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `simulado_cia_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },
};

/* ── Fechar modal clicando fora ──────────────────── */
$('modal-overlay').addEventListener('click', e => {
  if (e.target === $('modal-overlay')) hideModal();
});

/* ── Iniciar ─────────────────────────────────────── */
async function init() {
  /* carregar matérias customizadas do IndexedDB antes de renderizar */
  try {
    const customs = await loadCustomSubjects();
    customs.forEach(s => { SUBJECTS[s.key] = s; });
  } catch(_) {}

  const user = getUser();
  if (!user) { renderLogin(); return; }
  S.userName = user.name;
  renderSubjects();
}
init();
</script>
