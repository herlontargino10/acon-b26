<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulado CIA — Combate a Incêndio</title>
<style>
/* ── Variáveis ──────────────────────────────────── */
:root {
  --bg:      #080d18;
  --surface: #0f172a;
  --card:    #111827;
  --card2:   #1a2235;
  --border:  #1e2d45;
  --txt:     #e2e8f0;
  --muted:   #64748b;
  --blue:    #3b82f6;
  --blue2:   #1d4ed8;
  --green:   #10b981;
  --red:     #ef4444;
  --amber:   #f59e0b;
  --r:       13px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family: system-ui,'Segoe UI',Arial,sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ── Cabeçalho fixo ─────────────────────────────── */
#header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(8,13,24,.97);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px 10px;
}
.hd-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.hd-brand {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--blue);
}
.hd-meta {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13px;
  color: var(--muted);
}
#timer {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--txt);
  min-width: 42px;
  transition: color .4s;
}
/* feedback visual do timer por tempo decorrido */
#timer.warn { color: var(--amber); }
#timer.crit { color: var(--red); }
#q-counter { font-weight: 700; color: var(--txt); }

/* barra de progresso */
.prog-track {
  height: 5px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 10px;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), #60a5fa);
  border-radius: 999px;
  transition: width .4s cubic-bezier(.4,0,.2,1);
  width: 0%;
  box-shadow: 0 0 8px rgba(96,165,250,.35);
}

/* estatísticas no header */
.stats-row {
  display: flex;
  gap: 16px;
  font-size: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.stat-it { display: flex; align-items: center; gap: 5px; }
/* aproveitamento destacado no canto direito */
.stat-pct {
  margin-left: auto;
  font-size: 13px;
  font-weight: 800;
  color: var(--txt);
  background: rgba(59,130,246,.12);
  border: 1px solid rgba(59,130,246,.25);
  border-radius: 6px;
  padding: 2px 8px;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dg { background: var(--green); }
.dr { background: var(--red); }
.dm { background: var(--muted); }
.da { background: var(--amber); }

/* badge de modo */
.mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  transition: .15s;
  user-select: none;
  white-space: nowrap;
}
.mode-badge.study { border-color: var(--green); color: var(--green); background: rgba(16,185,129,.1); }
.mode-badge.exam  { border-color: var(--amber); color: var(--amber); background: rgba(245,158,11,.1); }

/* ── Layout principal ───────────────────────────── */
#app { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }

/* ── Card ───────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 28px;
  box-shadow: 0 4px 40px rgba(0,0,0,.45);
}
/* animação só na troca de questão — evita jitter em pick/verify */
.card.entering { animation: fadeUp .2s ease; }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(7px); }
}
/* entrada da explicação */
@keyframes slideReveal {
  from { opacity:0; transform:translateY(-4px); }
}
/* resposta errada */
@keyframes shake {
  0%,100% { transform:translateX(0); }
  20%     { transform:translateX(-6px); }
  40%     { transform:translateX(6px); }
  60%     { transform:translateX(-4px); }
  80%     { transform:translateX(4px); }
}
/* resposta certa */
@keyframes pop {
  0%   { transform:scale(1); }
  45%  { transform:scale(1.013); }
  100% { transform:scale(1); }
}

/* ── Tela Home ──────────────────────────────────── */
.home-wrap { max-width: 520px; margin: 56px auto 0; }
.home-title { font-size: 30px; font-weight: 900; margin-bottom: 6px; }
.home-sub { color: var(--muted); margin-bottom: 26px; font-size: 14px; }

.home-opts { display: flex; flex-direction: column; gap: 11px; margin-bottom: 22px; }
.home-opt {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 18px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 11px;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
}
.home-opt:hover  { border-color: var(--blue); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.home-opt.active { border-color: var(--blue); background: rgba(59,130,246,.08); }
.home-opt-icon { font-size: 22px; }
.home-opt-text strong { display: block; font-size: 15px; }
.home-opt-text span   { font-size: 13px; color: var(--muted); }
.home-btn-row { display: flex; gap: 10px; }

/* ── Questão ────────────────────────────────────── */
.q-hd {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
  margin-bottom: 18px;
}
.q-tag {
  display: inline-flex; align-items: center;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(59,130,246,.13);
  border: 1px solid rgba(59,130,246,.28);
  color: #93c5fd;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
}
.btn-flag {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  padding: 5px 10px;
  cursor: pointer; font-size: 14px;
  transition: .15s; flex-shrink: 0;
  font-family: inherit;
}
.btn-flag:hover  { border-color: var(--amber); color: var(--amber); }
.btn-flag.flagged { background: rgba(245,158,11,.14); border-color: var(--amber); color: var(--amber); }

.q-text {
  font-size: 18px; font-weight: 600;
  color: var(--txt); line-height: 1.55;
  margin-bottom: 22px;
}

/* ── Opções MC ──────────────────────────────────── */
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  padding: 13px 17px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  display: flex; align-items: center; gap: 12px;
  user-select: none;
  font-size: 15px;
}
.option:hover:not(.locked) { border-color: var(--blue); background: rgba(59,130,246,.06); box-shadow: inset 3px 0 0 rgba(59,130,246,.35); }
.option.selected { border-color: var(--blue); background: rgba(59,130,246,.09); box-shadow: inset 3px 0 0 rgba(59,130,246,.55); }
.option.correct  { border-color: var(--green); background: rgba(16,185,129,.11); box-shadow: inset 3px 0 0 rgba(16,185,129,.55); }
.option.wrong    { border-color: var(--red);   background: rgba(239,68,68,.11);  box-shadow: inset 3px 0 0 rgba(239,68,68,.55); }
.option.locked   { cursor: default; }
/* animações de feedback — só no render imediatamente após verificar */
.option.correct.anim { animation: pop .3s ease; }
.option.wrong.anim   { animation: shake .38s ease; }

.opt-ltr {
  width: 27px; height: 27px;
  border-radius: 50%;
  border: 1.5px solid var(--muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  flex-shrink: 0;
  color: var(--muted);
  transition: .15s;
  line-height: 1;
}
.option.selected .opt-ltr { border-color: var(--blue);  color: var(--blue); }
/* ✓/✗ no circle após verificação */
.option.correct  .opt-ltr { border-color: var(--green); color: var(--green); font-size: 14px; font-weight: 700; }
.option.wrong    .opt-ltr { border-color: var(--red);   color: var(--red);   font-size: 14px; font-weight: 700; }

/* ── Input Lacuna ───────────────────────────────── */
.gap-wrap { display: flex; flex-direction: column; gap: 8px; }
.gap-label { font-size: 13px; color: var(--muted); }
.gap-input {
  width: 100%; padding: 13px 15px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  color: var(--txt);
  font-size: 16px; font-family: inherit;
  outline: none;
  transition: border-color .15s;
}
.gap-input:focus   { border-color: var(--blue); }
.gap-input.correct { border-color: var(--green); background: rgba(16,185,129,.07); }
.gap-input.wrong   { border-color: var(--red);   background: rgba(239,68,68,.07); }
.gap-input:disabled { opacity: .7; }
.gap-answer-hint { font-size: 13px; color: var(--green); margin-top: 4px; display: none; }
.gap-answer-hint.show { display: block; }

/* ── Explicação ─────────────────────────────────── */
.explanation {
  margin-top: 18px; padding: 14px 17px;
  border-radius: 10px;
  border-left: 3px solid var(--blue);
  background: rgba(59,130,246,.06);
  font-size: 14px; color: #cbd5e1;
  display: none;
}
.explanation.show { display: block; animation: slideReveal .2s ease; }
.exp-res { font-weight: 800; margin-bottom: 5px; font-size: 14px; }
.exp-res.ok      { color: var(--green); }
.exp-res.bad     { color: var(--red); }
.exp-res.neutral { color: var(--muted); }

/* ── Barra de botões ────────────────────────────── */
.btn-bar {
  display: flex; gap: 9px;
  margin-top: 24px; flex-wrap: wrap;
  align-items: center;
}
.spacer { flex: 1; }
/* separador visual entre Próxima e Finalizar — evita cliques acidentais */
.btn-sep {
  width: 1px;
  align-self: stretch;
  background: var(--border);
  margin: 4px 2px;
  flex-shrink: 0;
}

button {
  padding: 12px 18px;
  border: none; border-radius: 10px;
  cursor: pointer; font-weight: 700;
  font-size: 14px; font-family: inherit;
  transition: opacity .15s, transform .1s, background .15s;
  white-space: nowrap;
}
button:active:not(:disabled) { transform: scale(.97); }
button:disabled { opacity: .4; cursor: not-allowed; }

.btn-p  { background: var(--blue); color: #fff; box-shadow: 0 2px 10px rgba(59,130,246,.3); }
.btn-p:hover:not(:disabled)  { background: var(--blue2); box-shadow: 0 4px 18px rgba(59,130,246,.45); }
.btn-s  { background: var(--surface); border: 1px solid var(--border); color: var(--txt); }
.btn-s:hover:not(:disabled)  { border-color: var(--blue); }
.btn-d  { background: #450a0a; color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
.btn-d:hover:not(:disabled)  { background: var(--red); color: #fff; }
.btn-ok { background: #052e16; color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
.btn-ok:hover:not(:disabled) { background: var(--green); color: #fff; }
/* botão Finalizar discreto — não compete com Próxima */
.btn-finish {
  background: transparent;
  border: 1px solid rgba(239,68,68,.3);
  color: #fca5a5;
  padding: 12px 13px;
  font-size: 13px;
  opacity: .7;
}
.btn-finish:hover:not(:disabled) { opacity: 1; background: #450a0a; border-color: var(--red); }

/* ── Modal ──────────────────────────────────────── */
#modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.78);
  z-index: 200; align-items: center;
  justify-content: center; padding: 20px;
}
#modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px; padding: 30px;
  max-width: 420px; width: 100%;
  box-shadow: 0 24px 80px rgba(0,0,0,.65);
  animation: fadeUp .2s ease;
}
.modal h2 { font-size: 19px; margin-bottom: 18px; }
.modal-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 11px; margin-bottom: 22px;
}
.modal-stat {
  background: var(--surface);
  border-radius: 10px; padding: 14px;
  text-align: center;
}
.modal-val { font-size: 28px; font-weight: 900; display: block; }
.modal-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
.modal-btns { display: flex; gap: 10px; }
.modal-btns button { flex: 1; }

/* ── Tela de Resultado ──────────────────────────── */
.result-hero { text-align: center; padding: 36px 0 28px; }
.result-pct {
  font-size: 88px; font-weight: 900; line-height: 1;
  background: linear-gradient(135deg, var(--blue), var(--green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.result-grade { font-size: 21px; font-weight: 700; margin-top: 10px; }
.result-lbl   { font-size: 14px; color: var(--muted); margin-top: 6px; }

.result-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
  gap: 11px; margin: 24px 0;
}
.res-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 16px;
  text-align: center;
}
.res-val { font-size: 30px; font-weight: 900; display: block; }
.res-lbl { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* pontos fortes e pontos a reforçar */
.highlights {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 14px; margin-top: 28px;
}
.hl-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px; padding: 16px;
}
.hl-box h4 {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
  margin-bottom: 10px;
}
.hl-box.good { border-color: rgba(16,185,129,.25); }
.hl-box.bad  { border-color: rgba(239,68,68,.2); }
.hl-box.good h4 { color: var(--green); }
.hl-box.bad  h4 { color: var(--red); }
.hl-item {
  font-size: 13px; color: var(--txt);
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,.05);
  display: flex; justify-content: space-between; gap: 8px;
}
.hl-item:last-child { border-bottom: none; padding-bottom: 0; }
.hl-pct { color: var(--muted); font-size: 12px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.hl-empty { font-size: 13px; color: var(--muted); font-style: italic; }

/* gráfico por categoria */
.cat-section { margin-top: 28px; }
.cat-section h3 {
  font-size: 12px; font-weight: 700;
  color: var(--muted); text-transform: uppercase;
  letter-spacing: .08em; margin-bottom: 14px;
}
.cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
.cat-name {
  width: 160px; flex-shrink: 0;
  color: var(--txt); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.cat-track {
  flex: 1; height: 7px;
  background: var(--border);
  border-radius: 999px; overflow: hidden;
}
.cat-fill { height: 100%; border-radius: 999px; transition: width .6s .15s; }
.cat-pct {
  width: 36px; text-align: right;
  color: var(--muted); font-variant-numeric: tabular-nums;
  font-size: 12px;
}

/* ── Login ──────────────────────────────────────── */
.login-form  { display: flex; flex-direction: column; gap: 14px; }
.form-group  { display: flex; flex-direction: column; gap: 5px; }
.login-err   { font-size: 13px; color: var(--red); min-height: 18px; }

/* ── Info de usuário no cabeçalho ───────────────── */
.hd-user {
  display: flex; align-items: center;
  gap: 8px; font-size: 12px; color: var(--muted);
}
.hd-user strong { color: var(--txt); font-weight: 700; }
.btn-switch {
  font-size: 11px; color: var(--muted);
  background: none; border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 8px;
  cursor: pointer; font-family: inherit;
  font-weight: 600; transition: .15s;
}
.btn-switch:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }

/* ── Tela de boas-vindas ────────────────────────── */
.welcome-info {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 22px; text-align: center; margin: 20px 0;
}
.welcome-q {
  font-size: 42px; font-weight: 900; line-height: 1;
  color: var(--txt); font-variant-numeric: tabular-nums;
}
.welcome-q span { color: var(--muted); font-weight: 400; font-size: 32px; }
.welcome-lbl {
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .07em; margin-top: 6px;
}

/* ── Modal de aviso de acesso ───────────────────── */
#notice-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#notice-overlay.open { display: flex; }

.notice-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 32px 28px 24px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 24px 80px rgba(0,0,0,.7);
  animation: fadeUp .25s ease;
  text-align: center;
}
.notice-icon  { font-size: 26px; margin-bottom: 10px; }
.notice-title {
  font-size: 13px; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--txt); margin-bottom: 18px;
}
.notice-divider { height: 1px; background: var(--border); margin: 16px 0; }
.notice-body {
  font-size: 14px; color: #cbd5e1;
  line-height: 1.75; text-align: center;
}
.notice-body p { margin-bottom: 10px; }
.notice-body p:last-child { margin-bottom: 0; }
.notice-check-row {
  display: inline-flex; align-items: center;
  gap: 8px; font-size: 13px; color: var(--muted);
  cursor: pointer; user-select: none;
  margin: 18px 0 16px;
}
.notice-check-row input[type="checkbox"] {
  width: 15px; height: 15px;
  cursor: pointer; accent-color: var(--blue);
  flex-shrink: 0;
}
.notice-footer {
  font-size: 11px; color: var(--muted);
  margin-top: 14px; letter-spacing: .03em;
}
.notice-footer strong { color: var(--txt); }

/* ── Responsivo ─────────────────────────────────── */
@media (max-width: 600px) {
  .card { padding: 18px; }
  .q-text { font-size: 16px; }
  button  { padding: 11px 13px; font-size: 13px; }
  .result-pct { font-size: 64px; }
  .cat-name { width: 110px; }
  .hd-brand { font-size: 11px; }
  .highlights { grid-template-columns: 1fr; }
}
@media (max-width: 400px) {
  .btn-sep { display: none; }
  .btn-bar { gap: 6px; }
  .stats-row { gap: 10px; font-size: 11px; }
  .stat-pct { font-size: 12px; }
}
</style>
</head>
<body>

<!-- ── Cabeçalho ─────────────────────────────────── -->
<div id="header">
  <div class="hd-top">
    <span class="hd-brand">🔥 Simulado CIA</span>
    <div class="hd-meta">
      <span id="user-info" class="hd-user"></span>
      <span id="mode-badge" class="mode-badge study" onclick="App.toggleMode()">📖 Estudo</span>
      <span id="timer"></span>
      <span id="q-counter"></span>
    </div>
  </div>
  <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
  <div class="stats-row" id="stats-row"></div>
</div>

<!-- ── Conteúdo ───────────────────────────────────── -->
<div id="app"></div>

<!-- ── Modal ─────────────────────────────────────── -->
<div id="modal-overlay">
  <div class="modal" id="modal-box"></div>
</div>

<!-- ── Aviso de acesso restrito ──────────────────── -->
<div id="notice-overlay">
  <div class="notice-box">
    <div class="notice-icon">🔒</div>
    <div class="notice-title">ACESSO RESTRITO</div>
    <div class="notice-divider"></div>
    <div class="notice-body">
      <p>Este material foi disponibilizado<br>para estudo individual.</p>
      <p>Por favor, não compartilhe<br>o arquivo nem a chave de acesso.</p>
      <p>Bom estudo.</p>
    </div>
    <div class="notice-divider"></div>
    <label class="notice-check-row">
      <input type="checkbox" id="notice-check">
      Não mostrar novamente
    </label>
    <button id="notice-btn" class="btn-p" style="width:100%">Entendi</button>
    <div class="notice-footer">Usuário autorizado: <strong id="notice-user"></strong></div>
  </div>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════
   BANCO DE QUESTÕES — não alterar conteúdo

/* ═══════════════════════════════════════════════════
   UTILITÁRIOS
   ═══════════════════════════════════════════════════ */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmt(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return h > 0
    ? `${h}:${pad(m)}:${pad(s)}`
    : `${pad(m)}:${pad(s)}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

/* Escapa HTML para evitar XSS ao inserir texto de questões */
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function $(id) { return document.getElementById(id); }

/* ═══════════════════════════════════════════════════
   PERSISTÊNCIA (localStorage)
   ═══════════════════════════════════════════════════ */
const KEY = 'cia_sim_v3';

function save() {
  if (S.phase !== 'quiz') return;
  try {
    localStorage.setItem(KEY, JSON.stringify({
      deck: S.deck, answers: S.answers,
      validated: S.validated, flagged: S.flagged,
      mode: S.mode, idx: S.idx, timer: S.timer,
      userName:  S.userName,
      startedAt: S.startedAt,
      ts: Date.now()
    }));
  } catch(_) {}
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (Date.now() - p.ts > 86400000) { localStorage.removeItem(KEY); return null; }
    /* ignorar progresso de outro usuário */
    if (p.userName && S.userName && p.userName !== S.userName) return null;
    return p;
  } catch(_) { return null; }
}

function clearSave() {
  try { localStorage.removeItem(KEY); } catch(_) {}
}

/* ── Sessão de usuário ───────────────────────────── */
function getUser() {
  try {
    const raw = localStorage.getItem(USER_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(_) { return null; }
}

function setUser(name) {
  try { localStorage.setItem(USER_KEY, JSON.stringify({ name, loginAt: Date.now() })); } catch(_) {}
}

function clearUser() {
  try { localStorage.removeItem(USER_KEY); } catch(_) {}
  clearSave();
  S.userName = null;
  stopTimer();
  renderLogin();
}

/* ═══════════════════════════════════════════════════
   PREPARAÇÃO DO DECK — aceita fonte opcional para revisar erros
   ═══════════════════════════════════════════════════ */
function prepareDeck(source) {
  return shuffle(source || QUESTIONS).map(q => {
    if (q.type === 'mc') {
      const idxs = shuffle([0,1,2,3]);
      return {
        ...q,
        shuffledOptions: idxs.map(i => q.options[i]),
        shuffledCorrect: idxs.indexOf(q.correct),
      };
    }
    return { ...q };
  });
}

/* ═══════════════════════════════════════════════════
   TIMER
   ═══════════════════════════════════════════════════ */
function updateTimerColor(sec) {
  const el = $('timer');
  if (!el) return;
  el.classList.toggle('warn', sec >= 1800 && sec < 3600);
  el.classList.toggle('crit', sec >= 3600);
}

function startTimer() {
  stopTimer();
  S.timerRef = setInterval(() => {
    S.timer++;
    const el = $('timer');
    if (el) el.textContent = fmt(S.timer);
    updateTimerColor(S.timer);
    if (S.timer % 30 === 0) save();
  }, 1000);
}
function stopTimer() {
  if (S.timerRef) { clearInterval(S.timerRef); S.timerRef = null; }
}

/* ═══════════════════════════════════════════════════
   ESTATÍSTICAS
   ═══════════════════════════════════════════════════ */
function isCorrectAt(i) {
  const q = S.deck[i];
  const a = S.answers[i];
  if (!S.validated[i] || a === undefined) return null;
  return q.type === 'mc'
    ? a === q.shuffledCorrect
    : String(a).trim().toLowerCase() === String(q.correct).trim().toLowerCase();
}

function stats() {
  let correct = 0, wrong = 0, unanswered = 0, flagged = 0;
  S.deck.forEach((_, i) => {
    if (S.flagged[i]) flagged++;
    const r = isCorrectAt(i);
    if (r === null) unanswered++;
    else if (r) correct++;
    else wrong++;
  });
  const answered = correct + wrong;
  const pct = answered ? Math.round(correct / answered * 100) : 0;
  return { correct, wrong, unanswered, flagged, answered, total: S.deck.length, pct };
}

function catStats() {
  const map = {};
  S.deck.forEach((q, i) => {
    if (!S.validated[i]) return;
    const c = q.category;
    if (!map[c]) map[c] = { correct: 0, total: 0 };
    map[c].total++;
    if (isCorrectAt(i)) map[c].correct++;
  });
  return Object.entries(map)
    .map(([name, d]) => ({ name, ...d, pct: Math.round(d.correct / d.total * 100) }))
    .sort((a, b) => b.total - a.total);
}

function renderHeader() {
  const badge   = $('mode-badge');

  const srow    = $('stats-row');
  const timerEl = $('timer');
  const uinfo   = $('user-info');

  /* exibe usuário + botão Trocar em todas as fases exceto login */
  if (uinfo) {
    uinfo.innerHTML = S.userName && S.phase !== 'login'
      ? `<strong>${esc(S.userName)}</strong>
         <button class="btn-switch" onclick="App.switchUser()">Trocar usuário</button>`
      : '';
  }

  if (S.phase !== 'quiz') {
    badge.style.display = 'none';
    counter.textContent = '';
    fill.style.width    = '0%';
    srow.innerHTML      = '';
    timerEl.textContent = '';
    timerEl.className   = '';
    return;
  }

  badge.style.display = '';
  syncBadge();

  const pct = ((S.idx + 1) / S.deck.length * 100).toFixed(1);
  fill.style.width    = pct + '%';
  counter.textContent = `${S.idx + 1} / ${S.deck.length}`;
  timerEl.textContent = fmt(S.timer);
  updateTimerColor(S.timer);

  const st = stats();
  srow.innerHTML = `
    <div class="stat-it"><span class="dot dg"></span>${st.correct} acertos</div>
    <div class="stat-it"><span class="dot dr"></span>${st.wrong} erros</div>
    <div class="stat-it"><span class="dot dm"></span>${st.unanswered} restantes</div>
    ${st.flagged ? `<div class="stat-it"><span class="dot da"></span>${st.flagged} marcadas</div>` : ''}
    ${st.answered ? `<span class="stat-pct">${st.pct}% aproveit.</span>` : ''}
  `;
}

function syncBadge() {
  const b = $('mode-badge');
  if (!b) return;
  if (S.mode === 'study') {
    b.textContent = '📖 Estudo';
    b.className = 'mode-badge study';
  } else {
    b.textContent = '📝 Prova';
    b.className = 'mode-badge exam';
  }
}

   ═══════════════════════════════════════════════════ */
function showAccessNotice(onClose) {
  /* já aceitou antes e não quer ver novamente */
  if (localStorage.getItem(NOTICE_KEY) === 'true') { onClose(); return; }

  const overlay  = $('notice-overlay');
  const btn      = $('notice-btn');
  const userSpan = $('notice-user');
  const chk      = $('notice-check');

  if (userSpan) userSpan.textContent = S.userName || '';
  if (chk)      chk.checked = false;

  overlay.classList.add('open');

  btn.onclick = () => {
    if (chk && chk.checked) {
      try { localStorage.setItem(NOTICE_KEY, 'true'); } catch(_) {}
    }
    overlay.classList.remove('open');
    onClose();
  };
}

/* ═══════════════════════════════════════════════════
   RENDER — QUESTÃO
   ═══════════════════════════════════════════════════ */
function renderQuestion() {
  S.phase = 'quiz';
  const q     = S.deck[S.idx];
  const val   = S.validated[S.idx];
  const flag  = S.flagged[S.idx];
  const ans   = S.answers[S.idx];
  const study = S.mode === 'study';

  /* consumir flags de animação antes de construir o HTML */
  const entering      = S.entering;      S.entering      = false;
  const justValidated = S.justValidated; S.justValidated = false;

  /* — corpo: opções MC ou input de lacuna — */
  let bodyHTML = '';

  if (q.type === 'mc') {
    const ltrs = ['A','B','C','D'];
    bodyHTML = '<div class="options">' +
      q.shuffledOptions.map((opt, i) => {
        let cls = 'option';
        let sym = ltrs[i];  // símbolo no círculo
        if (val) {
          cls += ' locked';
          if (i === q.shuffledCorrect) { cls += ' correct'; sym = '✓'; }
          else if (ans === i)          { cls += ' wrong';   sym = '✗'; }
          /* anima apenas no render imediatamente após verificar */
          if (justValidated && (i === q.shuffledCorrect || ans === i)) cls += ' anim';
        } else if (ans === i) {
          cls += ' selected';
        }
        const click = val ? '' : `onclick="App.pick(${i})"`;
        return `<div class="${cls}" ${click}>
          <span class="opt-ltr">${sym}</span>${esc(opt)}
        </div>`;
      }).join('') + '</div>';

  } else {
    let inputCls = 'gap-input';
    let hint     = '';
    if (val) {
      const ok = isCorrectAt(S.idx);
      inputCls += ok ? ' correct' : ' wrong';
      if (!ok && study) {
        hint = `<div class="gap-answer-hint show">✓ Resposta esperada: <strong>${esc(q.correct)}</strong></div>`;
      }
    }
    bodyHTML = `<div class="gap-wrap">
      <div class="gap-label">Digite a palavra ou expressão que completa a frase:</div>
      <input type="text" id="gap-input" class="${inputCls}"
        value="${val ? esc(String(ans ?? '')) : ''}"
        ${val ? 'disabled' : ''}
        placeholder="Sua resposta..."
        oninput="App.typeGap(this.value)"
        onkeydown="if(event.key==='Enter')App.verify()"
      />
      ${hint}
    </div>`;
  }

  /* — explicação — */
  let expHTML = '';
  if (val) {
    const ok = isCorrectAt(S.idx);
    if (study) {
      expHTML = `<div class="explanation show">
        <div class="exp-res ${ok ? 'ok' : 'bad'}">${ok ? '✅ Correto!' : '❌ Incorreto'}</div>
        ${esc(q.explanation)}
      </div>`;
    } else {
      expHTML = `<div class="explanation show">
        <div class="exp-res neutral">✓ Verificado (resultado no final)</div>
      </div>`;
    }
  }

  /* — botões de navegação — */
  const canVerify = ans !== undefined && ans !== '' && !val;
  const isLast    = S.idx === S.deck.length - 1;

  /* Na última questão o botão de avanço vira CTA verde de resultado */
  const nextBtn = isLast
    ? `<button class="btn-ok" onclick="App.confirmFinish()">🏁 Ver Resultado</button>`
    : `<button class="btn-s"  onclick="App.nav(1)">Próxima ➜</button>`;

  /* Botão Finalizar discreto só aparece quando não é a última questão */
  const finishBtn = isLast ? '' :
    `<div class="btn-sep"></div>
     <button class="btn-finish" onclick="App.confirmFinish()" title="Encerrar simulado agora">🏁</button>`;

  $('app').innerHTML = `
    <div class="card${entering ? ' entering' : ''}">
      <div class="q-hd">
        <span class="q-tag">${esc(q.category)}</span>
        <button class="btn-flag ${flag ? 'flagged' : ''}" onclick="App.toggleFlag()" title="Marcar para revisão">
          ${flag ? '🚩 Marcada' : '⚑ Marcar'}
        </button>
      </div>
      <div class="q-text">${esc(q.question)}</div>
      ${bodyHTML}
      ${expHTML}
      <div class="btn-bar">
        <button class="btn-s" onclick="App.nav(-1)" ${S.idx===0?'disabled':''}>⬅ Anterior</button>
        <button class="${val ? 'btn-s' : 'btn-p'}" onclick="App.verify()" ${!canVerify?'disabled':''}>
          ${val ? '✓ Verificado' : '✔ Verificar'}
        </button>
        <span class="spacer"></span>
        ${nextBtn}
        ${finishBtn}
      </div>
    </div>
  `;

  renderHeader();
}

/* ═══════════════════════════════════════════════════
   RENDER — RESULTADO FINAL
   ═══════════════════════════════════════════════════ */
function renderResult() {
  S.phase = 'result';
  stopTimer();
  clearSave();
  renderHeader();

  const st   = stats();
  const cs   = catStats();
  const pct  = Math.round(st.correct / st.total * 100);
  const time = fmt(S.timer);

  let grade, gc;
  if (pct >= 90)      { grade = 'Excelente! 🏆';           gc = '#10b981'; }
  else if (pct >= 70) { grade = 'Aprovado ✅';             gc = '#3b82f6'; }
  else if (pct >= 50) { grade = 'Regular — continue! ⚠️'; gc = '#f59e0b'; }
  else                { grade = 'Precisa reforçar ❌';     gc = '#ef4444'; }

  /* barras por categoria */
  const catHTML = cs.map(c => {
    const color = c.pct >= 70 ? '#10b981' : c.pct >= 50 ? '#f59e0b' : '#ef4444';
    return `<div class="cat-row">
      <span class="cat-name" title="${esc(c.name)}">${esc(c.name)}</span>
      <div class="cat-track">
        <div class="cat-fill" style="width:${c.pct}%;background:${color}"></div>
      </div>
      <span class="cat-pct">${c.pct}%</span>
    </div>`;
  }).join('');

  /* pontos fortes (>=70%) e pontos fracos (<50%) com mínimo 2 questões respondidas */
  const strong = cs.filter(c => c.pct >= 70 && c.total >= 2);
  const weak   = cs.filter(c => c.pct <  50 && c.total >= 2);

  const strongHTML = strong.length
    ? strong.map(c => `<div class="hl-item"><span>${esc(c.name)}</span><span class="hl-pct">${c.pct}%</span></div>`).join('')
    : `<div class="hl-empty">Nenhuma categoria com domínio alto ainda</div>`;

  const weakHTML = weak.length
    ? weak.map(c => `<div class="hl-item"><span>${esc(c.name)}</span><span class="hl-pct">${c.pct}%</span></div>`).join('')
    : `<div class="hl-empty">Sem categorias críticas — bom trabalho!</div>`;

  $('app').innerHTML = `
    <div class="card entering">
      <div class="result-hero">
        <div class="result-pct">${pct}%</div>
        <div class="result-grade" style="color:${gc}">${grade}</div>
        <div class="result-lbl">${st.correct} de ${st.total} questões &bull; ${time}</div>
      </div>

      <div class="result-grid">
        <div class="res-stat">
          <span class="res-val" style="color:var(--green)">${st.correct}</span>
          <div class="res-lbl">Acertos</div>
        </div>
        <div class="res-stat">
          <span class="res-val" style="color:var(--red)">${st.wrong}</span>
          <div class="res-lbl">Erros</div>
        </div>
        <div class="res-stat">
          <span class="res-val" style="color:var(--muted)">${st.unanswered}</span>
          <div class="res-lbl">Não respondidas</div>
        </div>
        <div class="res-stat">
          <span class="res-val" style="color:var(--blue)">${time}</span>
          <div class="res-lbl">Tempo total</div>
        </div>
      </div>

      <div class="highlights">
        <div class="hl-box good">
          <h4>✦ Pontos Fortes</h4>
          ${strongHTML}
        </div>
        <div class="hl-box bad">
          <h4>✦ Pontos a Reforçar</h4>
          ${weakHTML}
        </div>
      </div>

      ${cs.length ? `<div class="cat-section"><h3>Desempenho por Categoria</h3>${catHTML}</div>` : ''}

      <div class="btn-bar" style="margin-top:28px;flex-wrap:wrap">
        <button class="btn-p" onclick="App.restart()">🔄 Novo Simulado</button>
        ${st.wrong > 0 ? `<button class="btn-s" onclick="App.reviewWrong()">📋 Revisar Erros (${st.wrong})</button>` : ''}
        <button class="btn-s" onclick="App.exportJSON()">⬇ Exportar JSON</button>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════ */
function showModal(html) {
  $('modal-box').innerHTML = html;
  $('modal-overlay').classList.add('open');
}
function hideModal() {
  $('modal-overlay').classList.remove('open');
}

/* ═══════════════════════════════════════════════════
   CONTROLADOR PRINCIPAL
   ═══════════════════════════════════════════════════ */
const App = {

  /* validar credenciais e entrar */
  doLogin() {
    const nameEl = $('login-name');
    const keyEl  = $('login-key');
    const errEl  = $('login-err');
    const name = nameEl ? nameEl.value.trim() : '';
    const key  = keyEl  ? keyEl.value.trim().toUpperCase() : '';

    const canonical = CREDENTIALS[key];
    if (!canonical || name.toLowerCase() !== canonical.toLowerCase()) {
      if (errEl) errEl.textContent = 'Nome ou chave incorretos.';
      if (keyEl) { keyEl.value = ''; keyEl.focus(); }
      return;
    }

    S.userName = canonical;
    setUser(canonical);

    showAccessNotice(() => {
      const saved = loadSaved();
      if (saved) {
        renderWelcome(saved);
      } else {
        renderHome();
      }
    });
  },

  /* encerrar sessão e voltar ao login */
  switchUser() {
    clearUser(); // limpa localStorage de usuário e progresso, chama renderLogin
  },

  setMode(m) {
    S.mode = m;
    const os = $('opt-study'), oe = $('opt-exam');
    if (os) os.classList.toggle('active', m === 'study');
    if (oe) oe.classList.toggle('active', m === 'exam');
  },

  startNew() {
    clearSave();
    S.deck      = prepareDeck();
    S.answers   = Array(S.deck.length).fill(undefined);
    S.validated = Array(S.deck.length).fill(false);
    S.flagged   = Array(S.deck.length).fill(false);
    S.idx       = 0;
    S.timer     = 0;
    S.startedAt = Date.now();
    S.entering  = true;
    syncBadge();
    startTimer();
    renderQuestion();
  },

  continueSaved() {
    const p = loadSaved();
    if (!p) { this.startNew(); return; }
    Object.assign(S, {
      deck: p.deck, answers: p.answers,
      validated: p.validated, flagged: p.flagged,
      mode: p.mode, idx: p.idx, timer: p.timer,
      startedAt: p.startedAt || Date.now(),
    });
    S.entering = true;
    syncBadge();
    startTimer();
    renderQuestion();
  },

  /* selecionar opção MC */
  pick(i) {
    if (S.validated[S.idx]) return;
    S.answers[S.idx] = i;
    renderQuestion();
  },

  /* digitar em lacuna */
  typeGap(v) {
    S.answers[S.idx] = v;
  },

  /* verificar resposta */
  verify() {
    if (S.validated[S.idx]) return;
    const q = S.deck[S.idx];
    if (q.type === 'gap') {
      const inp = $('gap-input');
      if (inp) S.answers[S.idx] = inp.value;
    }
    if (S.answers[S.idx] === undefined || S.answers[S.idx] === '') return;
    S.validated[S.idx] = true;
    S.justValidated    = true;
    save();
    renderQuestion();
  },

  /* navegar entre questões */
  nav(dir) {
    const next = S.idx + dir;
    if (next < 0 || next >= S.deck.length) return;
    S.idx      = next;
    S.entering = true;
    save();
    renderQuestion();
  },

  toggleFlag() {
    S.flagged[S.idx] = !S.flagged[S.idx];
    save();
    renderQuestion();
  },

  toggleMode() {
    if (S.phase !== 'quiz') return;
    S.mode = S.mode === 'study' ? 'exam' : 'study';
    syncBadge();
    renderQuestion();
  },

  /* modal de confirmação antes de finalizar — ação segura é primária */
  confirmFinish() {
    const st = stats();
    showModal(`
      <h2>🏁 Finalizar Simulado?</h2>
      <div class="modal-grid">
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--green)">${st.correct}</span>
          <div class="modal-lbl">Acertos</div>
        </div>
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--red)">${st.wrong}</span>
          <div class="modal-lbl">Erros</div>
        </div>
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--muted)">${st.unanswered}</span>
          <div class="modal-lbl">Não respondidas</div>
        </div>
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--blue)">${st.answered ? st.pct + '%' : '—'}</span>
          <div class="modal-lbl">Aproveitamento parcial</div>
        </div>
      </div>
      <div class="modal-btns">
        <button class="btn-p" onclick="hideModal()">⬅ Continuar</button>
        <button class="btn-d" onclick="hideModal();renderResult()">Finalizar agora</button>
      </div>
    `);
  },

  /* deck de revisão com opções re-embaralhadas */
  reviewWrong() {
    const wrong = S.deck.filter((_, i) => isCorrectAt(i) === false);
    if (!wrong.length) return;
    S.deck      = prepareDeck(wrong);
    S.answers   = Array(S.deck.length).fill(undefined);
    S.validated = Array(S.deck.length).fill(false);
    S.flagged   = Array(S.deck.length).fill(false);
    S.idx       = 0;
    S.timer     = 0;
    S.phase     = 'quiz';
    S.entering  = true;
    startTimer();
    renderQuestion();
  },

  restart() {
    stopTimer();
    clearSave();
    S.mode = 'study';
    renderHome();
  },

  exportJSON() {
    const st = stats();
    const data = {
      data: new Date().toISOString(),
      pontuacao: st.pct + '%',
      acertos: st.correct, erros: st.wrong,
      nao_respondidas: st.unanswered, total: st.total,
      tempo: fmt(S.timer), modo: S.mode,
      categorias: catStats(),
      detalhes: S.deck.map((q, i) => ({
        categoria: q.category,
        questao: q.question,
        verificada: S.validated[i],
        correta: isCorrectAt(i),
        marcada: S.flagged[i],
      })),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `simulado_cia_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },
};

/* ── Fechar modal clicando fora ──────────────────── */
$('modal-overlay').addEventListener('click', e => {
  if (e.target === $('modal-overlay')) hideModal();
});

/* ── Iniciar ─────────────────────────────────────── */
function init() {
  const user = getUser();
  if (!user) { renderLogin(); return; }
  S.userName = user.name;
  const saved = loadSaved();
  if (saved) {
    renderWelcome(saved);
  } else {
    renderHome();
  }
}
init();
</script>
</body>
</html>
