/* ═══════════════════════════════════════════════════
   RENDER — QUESTÃO
   ═══════════════════════════════════════════════════ */
function renderQuestion() {
  S.phase = 'quiz';
  const q     = S.deck[S.idx];
  const val   = S.validated[S.idx];
  const flag  = S.flagged[S.idx];
  const ans   = S.answers[S.idx];
  const study = S.mode === 'study';

  /* consumir flags de animação antes de construir o HTML */
  const entering      = S.entering;      S.entering      = false;
  const justValidated = S.justValidated; S.justValidated = false;

  /* — corpo: opções MC, V/F, lacuna, discursiva ou associação — */
  let bodyHTML = '';

  if (q.type === 'mc') {
    const ltrs = ['A','B','C','D'];
    bodyHTML = '<div class="options">' +
      q.shuffledOptions.map((opt, i) => {
        let cls = 'option';
        let sym = ltrs[i];  // símbolo no círculo
        if (val) {
          cls += ' locked';
          if (i === q.shuffledCorrect) { cls += ' correct'; sym = '✓'; }
          else if (ans === i)          { cls += ' wrong';   sym = '✗'; }
          /* anima apenas no render imediatamente após verificar */
          if (justValidated && (i === q.shuffledCorrect || ans === i)) cls += ' anim';
        } else if (ans === i) {
          cls += ' selected';
        }
        const click = val ? '' : `onclick="App.pick(${i})"`;
        return `<div class="${cls}" ${click}>
          <span class="opt-ltr">${sym}</span>${esc(opt)}
        </div>`;
      }).join('') + '</div>';

  } else if (q.type === 'tf') {
    const correctBool = (q.correct === true || q.correct === 'true' || q.correct === 1);
    const opts = [{ label: 'Verdadeiro', val: true, sym: 'V' }, { label: 'Falso', val: false, sym: 'F' }];
    bodyHTML = '<div class="options">' +
      opts.map(o => {
        let cls = 'option';
        let sym = o.sym;
        if (val) {
          cls += ' locked';
          if (o.val === correctBool) { cls += ' correct'; sym = '✓'; }
          else if (ans === o.val)    { cls += ' wrong';   sym = '✗'; }
          if (justValidated && (o.val === correctBool || ans === o.val)) cls += ' anim';
        } else if (ans === o.val) {
          cls += ' selected';
        }
        const click = val ? '' : `onclick="App.pickTF(${o.val})"`;
        return `<div class="${cls}" ${click}>
          <span class="opt-ltr">${sym}</span>${o.label}
        </div>`;
      }).join('') + '</div>';

  } else if (q.type === 'gap') {
    let inputCls = 'gap-input';
    let hint     = '';
    if (val) {
      const ok = isCorrectAt(S.idx);
      inputCls += ok ? ' correct' : ' wrong';
      if (!ok && study) {
        hint = `<div class="gap-answer-hint show">✓ Resposta esperada: <strong>${esc(q.correct)}</strong></div>`;
      }
    }
    bodyHTML = `<div class="gap-wrap">
      <div class="gap-label">Digite a palavra ou expressão que completa a frase:</div>
      <input type="text" id="gap-input" class="${inputCls}"
        value="${esc(String(ans ?? ''))}"
        ${val ? 'disabled' : ''}
        placeholder="Sua resposta..."
        oninput="App.typeGap(this.value)"
        onkeydown="if(event.key==='Enter')App.verify()"
      />
      ${hint}
    </div>`;

  } else if (q.type === 'disc') {
    if (!val) {
      bodyHTML = `<div class="gap-wrap">
        <div class="gap-label">Digite sua resposta:</div>
        <textarea id="disc-input" class="gap-input" rows="4"
          placeholder="Sua resposta...">${esc(String(ans ?? ''))}</textarea>
      </div>`;
    } else {
      const evVal = S.discEval[S.idx];
      bodyHTML = `<div class="gap-wrap">
        <div class="gap-label">Sua resposta:</div>
        <div class="gap-input" style="white-space:pre-wrap">${esc(String(ans || '(sem resposta)'))}</div>
        ${q.correct ? `<div class="gap-label" style="margin-top:10px">Gabarito / resposta esperada:</div>
        <div class="gap-input" style="white-space:pre-wrap;border-color:var(--blue)">${esc(String(q.correct))}</div>` : ''}
        <div class="gap-label" style="margin-top:12px">Você acertou?</div>
        <div style="display:flex;gap:10px">
          <button class="${evVal==='correct' ? 'btn-ok' : 'btn-s'}" onclick="App.selfGradeDisc(true)">✅ Acertei</button>
          <button class="${evVal==='wrong'   ? 'btn-d'  : 'btn-s'}" onclick="App.selfGradeDisc(false)">❌ Errei</button>
        </div>
      </div>`;
    }

  } else if (q.type === 'assoc') {
    const n            = (q.options || []).length;
    const order        = q.assocOrder || [...Array(n).keys()];
    const currentAns   = Array.isArray(ans) ? ans : Array(n).fill(undefined);
    bodyHTML = '<div style="display:flex;flex-direction:column;gap:10px">' +
      q.options.map((pair, li) => {
        const leftLabel  = pair[0];
        const selected   = currentAns[li];
        const correctIdx = (q.correct && q.correct[li] !== undefined) ? q.correct[li] : li;
        let rowCls = 'option';
        if (val) {
          rowCls += ' locked';
          rowCls += (selected === correctIdx) ? ' correct' : ' wrong';
        }
        const optsHTML = `<option value="" ${selected===undefined?'selected':''}>Selecione...</option>` +
          order.map(origIdx =>
            `<option value="${origIdx}" ${selected===origIdx?'selected':''}>${esc(q.options[origIdx][1])}</option>`
          ).join('');
        return `<div class="${rowCls}" style="justify-content:space-between;gap:12px">
          <span style="flex:1">${esc(leftLabel)}</span>
          <select class="gap-input" style="width:auto;min-width:170px;margin:0;flex-shrink:0"
            ${val ? 'disabled' : ''} onchange="App.pickAssoc(${li}, this.value)">
            ${optsHTML}
          </select>
        </div>`;
      }).join('') + '</div>';
  }

  /* — explicação — */
  let expHTML = '';
  if (val) {
    if (q.type === 'disc') {
      const ev = S.discEval[S.idx];
      if (ev === undefined) {
        expHTML = q.explanation ? `<div class="explanation show">
          <div class="exp-res neutral">Marque acima se você acertou ou errou</div>
          ${esc(q.explanation)}
        </div>` : '';
      } else {
        expHTML = `<div class="explanation show">
          <div class="exp-res ${ev==='correct' ? 'ok' : 'bad'}">${ev==='correct' ? '✅ Você marcou: Acertei' : '❌ Você marcou: Errei'}</div>
          ${esc(q.explanation || '')}
        </div>`;
      }
    } else {
      const ok = isCorrectAt(S.idx);
      if (study) {
        expHTML = `<div class="explanation show">
          <div class="exp-res ${ok ? 'ok' : 'bad'}">${ok ? '✅ Correto!' : '❌ Incorreto'}</div>
          ${esc(q.explanation)}
        </div>`;
      } else {
        expHTML = `<div class="explanation show">
          <div class="exp-res neutral">✓ Verificado (resultado no final)</div>
        </div>`;
      }
    }
  }

  /* — botões de navegação — */
  const canVerify = !val && answerReady(q, ans);
  const isLast    = S.idx === S.deck.length - 1;

  /* Na última questão o botão de avanço vira CTA verde de resultado */
  const nextBtn = isLast
    ? `<button class="btn-ok" onclick="App.confirmFinish()">🏁 Ver Resultado</button>`
    : `<button class="btn-s"  onclick="App.nav(1)">Próxima ➜</button>`;

  /* Botão Finalizar discreto só aparece quando não é a última questão */
  const finishBtn = isLast ? '' :
    `<div class="btn-sep"></div>
     <button class="btn-finish" onclick="App.confirmFinish()" title="Encerrar simulado agora">🏁</button>`;

  $('app').innerHTML = `
    <div class="card${entering ? ' entering' : ''}">
      <div class="q-hd">
        <span class="q-tag">${esc(q.category)}</span>
        <div style="display:flex;gap:6px;flex-shrink:0">
          <button class="btn-flag ${isFav(q, S.subject||'cia') ? 'fav-active' : ''}"
            onclick="App.toggleFavorite()" title="Favoritar">
            ${isFav(q, S.subject||'cia') ? '⭐' : '☆'}
          </button>
          <button class="btn-flag ${flag ? 'flagged' : ''}" onclick="App.toggleFlag()" title="Marcar para revisão">
            ${flag ? '🚩 Marcada' : '⚑ Marcar'}
          </button>
        </div>
      </div>
      <div class="q-text">${esc(q.question)}</div>
      ${bodyHTML}
      ${expHTML}
      <div class="btn-bar">
        <button class="btn-s" onclick="App.nav(-1)" ${S.idx===0?'disabled':''}>⬅ Anterior</button>
        <button id="btn-verify" class="${val ? 'btn-s' : 'btn-p'}" onclick="App.verify()" ${!canVerify?'disabled':''}>
          ${val ? '✓ Verificado' : '✔ Verificar'}
        </button>
        <span class="spacer"></span>
        ${nextBtn}
        ${finishBtn}
      </div>
    </div>
  `;

  renderHeader();
}

/* ═══════════════════════════════════════════════════
   RENDER — RESULTADO FINAL
   ═══════════════════════════════════════════════════ */
function renderResult() {
  S.phase = 'result';
  stopTimer();
  clearSave();
  renderHeader();

  const st   = stats();
  const cs   = catStats();
  const pct  = Math.round(st.correct / st.total * 100);
  const time = fmt(S.timer);

  let grade, gc;
  if (pct >= 90)      { grade = 'Excelente! 🏆';           gc = '#10b981'; }
  else if (pct >= 70) { grade = 'Aprovado ✅';             gc = '#3b82f6'; }
  else if (pct >= 50) { grade = 'Regular — continue! ⚠️'; gc = '#f59e0b'; }
  else                { grade = 'Precisa reforçar ❌';     gc = '#ef4444'; }

  /* barras por categoria */
  const catHTML = cs.map(c => {
    const color = c.pct >= 70 ? '#10b981' : c.pct >= 50 ? '#f59e0b' : '#ef4444';
    return `<div class="cat-row">
      <span class="cat-name" title="${esc(c.name)}">${esc(c.name)}</span>
      <div class="cat-track">
        <div class="cat-fill" style="width:${c.pct}%;background:${color}"></div>
      </div>
      <span class="cat-pct">${c.pct}%</span>
    </div>`;
  }).join('');

  /* pontos fortes (>=70%) e pontos fracos (<50%) com mínimo 2 questões respondidas */
  const strong = cs.filter(c => c.pct >= 70 && c.total >= 2);
  const weak   = cs.filter(c => c.pct <  50 && c.total >= 2);

  const strongHTML = strong.length
    ? strong.map(c => `<div class="hl-item"><span>${esc(c.name)}</span><span class="hl-pct">${c.pct}%</span></div>`).join('')
    : `<div class="hl-empty">Nenhuma categoria com domínio alto ainda</div>`;

  const weakHTML = weak.length
    ? weak.map(c => `<div class="hl-item"><span>${esc(c.name)}</span><span class="hl-pct">${c.pct}%</span></div>`).join('')
    : `<div class="hl-empty">Sem categorias críticas — bom trabalho!</div>`;

  /* label de modo */
  const modeLabel = S.mode === 'exam'
    ? `<span class="review-pill" style="border-color:rgba(59,130,246,.35);color:#93c5fd;background:rgba(59,130,246,.1)">🎯 Modo Prova</span>`
    : `<span class="review-pill" style="border-color:rgba(16,185,129,.3);color:#6ee7b7;background:rgba(16,185,129,.07)">📚 Modo Treino</span>`;

  /* sugestões exclusivas do modo treino */
  const trainingExtra = S.mode === 'study' ? (() => {
    const pendingNow = getPendingReview(S.subject || 'cia').length;
    const tips = weak.slice(0, 3).map(c =>
      `<div class="suggestion-item"><span>→</span> Revisar <strong>${esc(c.name)}</strong> (${c.pct}% de acerto)</div>`
    ).join('');
    return `<div class="suggestion-box">
      <h4>📋 Próximos passos</h4>
      ${pendingNow > 0
        ? `<div class="suggestion-item"><span>🔁</span> <strong>${pendingNow}</strong> questões na fila de revisão</div>`
        : ''}
      ${tips || (pendingNow === 0 ? '<div class="suggestion-item"><span>✅</span> Boa performance! Continue praticando.</div>' : '')}
    </div>`;
  })() : '';

  $('app').innerHTML = `
    <div class="card entering">
      <div class="result-hero">
        <div class="result-session-label">Sessão Concluída</div>
        <div class="result-pct">${pct}%</div>
        <div class="result-grade" style="color:${gc}">${grade}</div>
        <div class="result-lbl">${st.correct} de ${st.total} questões &bull; ${time}</div>
        <div style="margin-top:10px">${modeLabel}</div>
      </div>

      <div class="result-grid">
        <div class="res-stat">
          <span class="res-val" style="color:var(--green)">${st.correct}</span>
          <div class="res-lbl">Acertos</div>
        </div>
        <div class="res-stat">
          <span class="res-val" style="color:var(--red)">${st.wrong}</span>
          <div class="res-lbl">Erros</div>
        </div>
        <div class="res-stat">
          <span class="res-val" style="color:var(--muted)">${st.unanswered}</span>
          <div class="res-lbl">Não respondidas</div>
        </div>
        <div class="res-stat">
          <span class="res-val" style="color:var(--blue)">${time}</span>
          <div class="res-lbl">Tempo total</div>
        </div>
      </div>

      <div class="highlights">
        <div class="hl-box good">
          <h4>✦ Pontos Fortes</h4>
          ${strongHTML}
        </div>
        <div class="hl-box bad">
          <h4>✦ Pontos a Reforçar</h4>
          ${weakHTML}
        </div>
      </div>

      ${trainingExtra}

      ${cs.length ? `<div class="cat-section"><h3>Desempenho por Categoria</h3>${catHTML}</div>` : ''}

      <div class="btn-bar" style="margin-top:28px;flex-wrap:wrap">
        ${S.reviewMode
          ? `<button class="btn-p" onclick="App.goReview()">🔁 Voltar à Revisão</button>
             <button class="btn-s" onclick="App.restart()">🏠 Início</button>`
          : `<button class="btn-p" onclick="App.restart()">🔄 Novo Simulado</button>
             ${st.wrong > 0 ? `<button class="btn-s" onclick="App.reviewWrong()">📋 Revisar Erros (${st.wrong})</button>` : ''}`
        }
        <button class="btn-s" onclick="App.exportJSON()">⬇ Exportar JSON</button>
      </div>
    </div>
  `;
}

/* ═══════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════ */
function showModal(html) {
  $('modal-box').innerHTML = html;
  $('modal-overlay').classList.add('open');
}
function hideModal() {
  $('modal-overlay').classList.remove('open');
}

/* ═══════════════════════════════════════════════════
   CONTROLADOR PRINCIPAL
   ═══════════════════════════════════════════════════ */
const App = {

  /* ── Importação ──────────────────────────────── */
  openImport() {
    const inp = $('import-file-input');
    if (inp) inp.click();
  },

  async handleImportFile(file) {
    if (!file) return;
    const result = await importQuestions(file);
    if (result.error) {
      showModal(`<h2>⚠️ Erro na Importação</h2>
        <p style="font-size:14px;color:var(--muted);margin:12px 0">${esc(result.error)}</p>
        <div class="modal-btns"><button class="btn-p" onclick="hideModal()">OK</button></div>`);
      return;
    }
    _pendingImport = result;
    const nameDefault = file.name.replace(/\.(json|txt)$/i,'').replace(/[_\-]/g,' ');
    const types = [...new Set(result.valid.map(q => q.type.toUpperCase()))].join(', ');
    /* matérias já existentes elegíveis a receber as questões importadas */
    const customs = Object.values(SUBJECTS).filter(s => s.isCustom && !s.hidden);
    const targetOptions = customs.length === 0 ? '' : `
      <div class="form-group" style="margin-bottom:10px">
        <label class="gap-label">Destino</label>
        <select id="import-target" class="gap-input" onchange="App.toggleImportTarget()">
          <option value="">＋ Criar nova matéria</option>
          ${customs.map(s => `<option value="${s.key}">${s.icon} ${esc(s.title)} — ${s.questions.length} questões</option>`).join('')}
        </select>
      </div>`;
    const statsBlock = `
      <div class="modal-grid">
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--green)">${result.valid.length}</span>
          <div class="modal-lbl">Importadas</div>
        </div>
        <div class="modal-stat">
          <span class="modal-val" style="color:${result.invalid>0?'var(--red)':'var(--muted)'}">${result.invalid}</span>
          <div class="modal-lbl">Ignoradas</div>
        </div>
      </div>`;
    showModal(`
      <h2>📥 Importar Questões</h2>
      ${targetOptions}
      <div id="import-name-wrap">
        <div class="form-group" style="margin-bottom:10px">
          <label class="gap-label">Nome da matéria</label>
          <input type="text" id="import-name" class="gap-input"
            value="${esc(nameDefault)}" placeholder="Ex: Navegação Avançada"
            onkeydown="if(event.key==='Enter')App.confirmImport()">
        </div>
        <div style="display:flex;gap:10px;margin-bottom:14px">
          <div class="form-group" style="flex:0 0 80px">
            <label class="gap-label">Ícone</label>
            <input type="text" id="import-icon" class="gap-input"
              value="📗" style="font-size:20px;text-align:center;padding:8px">
          </div>
          <div style="flex:1;align-self:end">${statsBlock}</div>
        </div>
      </div>
      <div id="import-merge-wrap" style="display:none;margin-bottom:14px">
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
          As questões serão adicionadas à matéria selecionada, preservando as já existentes.
        </div>
        ${statsBlock}
      </div>
      ${types ? `<div style="font-size:12px;color:var(--muted);margin-bottom:14px">Tipos encontrados: ${esc(types)}</div>` : ''}
      ${result.valid.length===0 ? `<div class="login-err">Nenhuma questão válida encontrada.</div>` : ''}
      <div class="modal-btns">
        <button class="btn-s" onclick="hideModal()">Cancelar</button>
        ${result.valid.length>0
          ? `<button id="import-confirm-btn" class="btn-p" onclick="App.confirmImport()">✓ Confirmar (${result.valid.length})</button>`
          : ''}
      </div>`);
    setTimeout(() => { const el=$('import-name'); if(el) el.select(); }, 60);
  },

  /* alterna entre "criar nova matéria" e "adicionar a matéria existente" */
  toggleImportTarget() {
    const targetEl = $('import-target');
    const isNew    = !targetEl || !targetEl.value;
    const nameWrap  = $('import-name-wrap');
    const mergeWrap = $('import-merge-wrap');
    if (nameWrap)  nameWrap.style.display  = isNew ? '' : 'none';
    if (mergeWrap) mergeWrap.style.display = isNew ? 'none' : '';
    const btn = $('import-confirm-btn');
    if (btn && _pendingImport) {
      btn.textContent = isNew
        ? `✓ Confirmar (${_pendingImport.valid.length})`
        : `✓ Adicionar (${_pendingImport.valid.length})`;
    }
  },

  async confirmImport() {
    if (!_pendingImport) return;
    const targetEl = $('import-target');
    const targetKey = targetEl ? targetEl.value : '';
    if (targetKey) { App.confirmImportMerge(targetKey); return; }

    const nameEl = $('import-name');
    const iconEl = $('import-icon');
    const name   = nameEl ? nameEl.value.trim() : 'Matéria Importada';
    const icon   = iconEl ? (iconEl.value.trim() || '📗') : '📗';
    if (!name) { if (nameEl) nameEl.focus(); return; }
    const key = makeSubjectKey(name);
    hideModal();
    await createSubject(key, name, icon, _pendingImport.valid);
    _pendingImport = null;
    App.selectSubject(key);
  },

  /* ── Adicionar questões importadas a uma matéria existente ─────── */
  confirmImportMerge(targetKey) {
    const subj = SUBJECTS[targetKey];
    if (!subj || !_pendingImport) return;
    /* Não há um identificador confiável entre arquivos diferentes — a
       única comparação possível é o texto do enunciado. Em vez de
       deduplicar automaticamente (regra frágil), apenas informa a
       contagem de possíveis duplicatas e deixa a decisão para o usuário. */
    const existingTexts = new Set(subj.questions.map(q => q.question.trim().toLowerCase()));
    const dupCount = _pendingImport.valid.filter(q => existingTexts.has(q.question.trim().toLowerCase())).length;
    if (dupCount > 0) {
      showModal(`
        <h2>⚠️ Possíveis Duplicatas</h2>
        <p style="font-size:14px;color:var(--muted);margin:12px 0;line-height:1.6">
          ${dupCount} de ${_pendingImport.valid.length} questão(ões) do arquivo têm o mesmo enunciado
          de questões já existentes em <strong>${esc(subj.title)}</strong>.<br><br>
          Não é possível garantir com certeza se são duplicadas — apenas o texto foi comparado.
        </p>
        <div class="modal-btns">
          <button class="btn-s" onclick="hideModal()">Cancelar</button>
          <button class="btn-p" onclick="App.doImportMerge('${targetKey}')">Importar mesmo assim</button>
        </div>`);
      return;
    }
    App.doImportMerge(targetKey);
  },

  async doImportMerge(targetKey) {
    const subj = SUBJECTS[targetKey];
    if (!subj || !_pendingImport) return;
    /* IDs novos para as questões importadas — evita colisão com as já
       existentes na matéria (nenhuma questão existente é removida). */
    const incoming = _pendingImport.valid.map(q => ({ ...q, _id: makeQuestionId() }));
    subj.questions.push(...incoming);
    await saveSubjectToDB(subj);
    hideModal();
    _pendingImport = null;
    renderSubjectEditor(targetKey);
  },

  /* ── Gerenciamento ────────────────────────────── */
  goManageSubjects() { renderManageSubjects(); },

  /* abre/fecha o menu de ações (⋮) de uma matéria, fechando os demais */
  toggleRowMenu(ev, key) {
    ev.stopPropagation();
    const id = 'row-menu-' + key;
    document.querySelectorAll('.row-menu.open').forEach(m => {
      if (m.id !== id) m.classList.remove('open');
    });
    const menu = $(id);
    if (menu) menu.classList.toggle('open');
  },

  async editSubjectName(key) {
    const s = SUBJECTS[key];
    if (!s || !s.isCustom) return;
    showModal(`
      <h2>✏️ Editar Matéria</h2>
      <div class="form-group" style="margin-bottom:10px">
        <label class="gap-label">Nome</label>
        <input type="text" id="edit-name" class="gap-input" value="${esc(s.title)}"
          onkeydown="if(event.key==='Enter')App.applyEditName('${key}')">
      </div>
      <div class="form-group" style="margin-bottom:14px">
        <label class="gap-label">Ícone</label>
        <input type="text" id="edit-icon" class="gap-input"
          value="${esc(s.icon)}" style="width:70px;font-size:20px;text-align:center;padding:8px">
      </div>
      <div class="modal-btns">
        <button class="btn-s" onclick="hideModal()">Cancelar</button>
        <button class="btn-p" onclick="App.applyEditName('${key}')">Salvar</button>
      </div>`);
    setTimeout(() => { const el=$('edit-name'); if(el){el.select();} }, 60);
  },

  async applyEditName(key) {
    const s    = SUBJECTS[key];
    const name = ($('edit-name')||{}).value?.trim();
    const icon = ($('edit-icon')||{}).value?.trim() || s.icon;
    if (!name || !s) return;
    s.title = name; s.label = name; s.icon = icon;
    await saveSubjectToDB(s);
    hideModal();
    /* retorna ao editor se veio de lá, senão ao gerenciar */
    if (S.phase === 'subject-editor') renderSubjectEditor(key);
    else renderManageSubjects();
  },

  /* ── Ocultar / mostrar matéria na Biblioteca ──── */
  async toggleHideSubject(key) {
    const s = SUBJECTS[key];
    if (!s || !s.isCustom) return;
    s.hidden = !s.hidden;
    await saveSubjectToDB(s);
    /* atualiza a tela correta conforme origem */
    if (S.phase === 'subjects') renderSubjects();
    else renderManageSubjects();
  },

  /* ── Proteger / desproteger contra exclusão ──── */
  async toggleProtectSubject(key) {
    const s = SUBJECTS[key];
    if (!s || !s.isCustom) return;
    s.protected = !s.protected;
    await saveSubjectToDB(s);
    renderManageSubjects();
  },

  /* ── Criar matéria vazia ──────────────────────── */
  createEmptySubject() {
    showModal(`
      <h2>＋ Nova Matéria</h2>
      <div class="form-group" style="margin-bottom:10px">
        <label class="gap-label">Nome</label>
        <input type="text" id="new-subj-name" class="gap-input" placeholder="Ex: Física Naval"
          onkeydown="if(event.key==='Enter')App.confirmCreateSubject()">
      </div>
      <div class="form-group" style="margin-bottom:14px">
        <label class="gap-label">Ícone</label>
        <input type="text" id="new-subj-icon" class="gap-input"
          value="📘" style="width:70px;font-size:20px;text-align:center;padding:8px">
      </div>
      <div class="modal-btns">
        <button class="btn-s" onclick="hideModal()">Cancelar</button>
        <button class="btn-p" onclick="App.confirmCreateSubject()">Criar Matéria</button>
      </div>`);
    setTimeout(() => { const el=$('new-subj-name'); if(el) el.focus(); }, 50);
  },

  async confirmCreateSubject() {
    const nameEl = $('new-subj-name');
    const iconEl = $('new-subj-icon');
    const name   = nameEl ? nameEl.value.trim() : '';
    const icon   = iconEl ? (iconEl.value.trim() || '📘') : '📘';
    if (!name) { if (nameEl) nameEl.focus(); return; }
    const key = makeSubjectKey(name);
    hideModal();
    await createSubject(key, name, icon, []);
    renderSubjectEditor(key);
  },

  /* ── Abrir editor de uma matéria ─────────────── */
  openSubjectEditor(key) {
    renderSubjectEditor(key);
  },

  /* ── Questões: adicionar / editar / excluir ───── */
  addQuestion(key) {
    renderQuestionForm(key, -1);
  },

  editQuestion(key, qIdx) {
    renderQuestionForm(key, qIdx);
  },

  deleteQuestion(key, qIdx) {
    const subj = SUBJECTS[key];
    if (!subj) return;
    const preview = (subj.questions[qIdx]?.question || '').slice(0, 80);
    showModal(`
      <h2>🗑 Excluir Questão?</h2>
      <p style="font-size:13px;color:var(--muted);margin:10px 0 16px">${esc(preview)}${preview.length===80?'…':''}</p>
      <div class="modal-btns">
        <button class="btn-p" onclick="hideModal()">Cancelar</button>
        <button class="btn-d" onclick="App.confirmDeleteQuestion('${key}',${qIdx})">Excluir</button>
      </div>`);
  },

  async confirmDeleteQuestion(key, qIdx) {
    const subj = SUBJECTS[key];
    if (!subj) return;
    subj.questions.splice(qIdx, 1);
    await saveSubjectToDB(subj);
    hideModal();
    renderSubjectEditor(key);
  },

  /* ── Salvar questão do formulário ─────────────── */
  async saveQuestion() {
    const key  = S.editorSubjectKey;
    const qIdx = S.editorQIdx;
    const subj = SUBJECTS[key];
    if (!subj) return;

    const q = readQuestionForm();
    if (!q.question.trim()) {
      const el = $('qf-question');
      if (el) { el.style.borderColor = 'var(--red)'; el.focus(); }
      return;
    }

    if (q.type === 'assoc') {
      /* descarta pares em branco e reindexa o mapeamento identidade */
      q.options = (q.options || []).filter(p => (p[0]||'').trim() !== '' || (p[1]||'').trim() !== '');
      q.correct = q.options.map((_, i) => i);
      if (q.options.length < 2) {
        showModal(`<h2>⚠️ Pares insuficientes</h2>
          <p style="font-size:14px;color:var(--muted);margin:12px 0">Adicione pelo menos 2 pares completos de associação.</p>
          <div class="modal-btns"><button class="btn-p" onclick="hideModal()">OK</button></div>`);
        return;
      }
    }

    if (qIdx === -1) {
      q._id = makeQuestionId();
      subj.questions.push(q);
    } else {
      /* preserva a identidade da questão (usada por revisão/favoritos)
         mesmo que o enunciado tenha mudado */
      const prev = subj.questions[qIdx];
      q._id = prev._id || prev.question;
      subj.questions[qIdx] = q;
    }

    await saveSubjectToDB(subj);
    renderSubjectEditor(key);
  },

  cancelQuestionEdit() {
    renderSubjectEditor(S.editorSubjectKey);
  },

  /* Troca o tipo da questão e regenera campos dinâmicos */
  switchQType(type) {
    document.querySelectorAll('.qtype-tab').forEach(t =>
      t.classList.toggle('active', t.dataset.type === type));
    const q = readQuestionForm();
    q.type = type;
    const d = $('qf-dynamic');
    if (d) d.innerHTML = buildDynamicFields(q);
  },

  /* Adiciona um par vazio ao formulário de associação (assoc) */
  addAssocPair() {
    const q = readQuestionForm();
    q.type = 'assoc';
    q.options = [...(q.options || []), ['', '']];
    const d = $('qf-dynamic');
    if (d) d.innerHTML = buildDynamicFields(q);
  },

  /* Remove um par do formulário de associação (assoc) */
  removeAssocPair(i) {
    const q = readQuestionForm();
    q.type = 'assoc';
    q.options = (q.options || []).filter((_, idx) => idx !== i);
    const d = $('qf-dynamic');
    if (d) d.innerHTML = buildDynamicFields(q);
  },

  /* ── Exportar banco de questões ───────────────── */
  exportSubjectBank(key) {
    const subj = SUBJECTS[key];
    if (!subj) return;
    const blob = new Blob([JSON.stringify(subj.questions, null, 2)], { type:'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = (subj.title || key).toLowerCase().replace(/\s+/g,'_') + '_questoes.json';
    a.click();
    URL.revokeObjectURL(url);
  },

  async duplicateSubject(key) {
    const src = SUBJECTS[key];
    if (!src) return;
    const newKey = makeSubjectKey(src.title + '_copia');
    /* clonagem profunda — nunca compartilhar o array/objetos de questões
       com a matéria de origem (editar a cópia não pode afetar a original,
       e vice-versa). IDs novos por questão: a cópia começa limpa, sem
       vínculo com progresso/revisão/favoritos da matéria original (que
       são indexados por matéria + questão). */
    const clonedQuestions = JSON.parse(JSON.stringify(src.questions))
      .map(q => ({ ...q, _id: makeQuestionId() }));
    await createSubject(newKey, src.title + ' (Cópia)', src.icon, clonedQuestions);
    renderManageSubjects();
  },

  async deleteSubject(key) {
    const s = SUBJECTS[key];
    if (!s || !s.isCustom) return;
    /* bloqueio de proteção */
    if (s.protected) {
      showModal(`
        <h2>🔒 Matéria Protegida</h2>
        <p style="font-size:14px;color:var(--muted);margin:12px 0">
          Remova a proteção (🔓) antes de excluir.
        </p>
        <div class="modal-btns"><button class="btn-p" onclick="hideModal()">OK</button></div>`);
      return;
    }
    /* validação por chave de acesso */
    showModal(`
      <h2>🗑 Excluir Matéria?</h2>
      <p style="font-size:13px;color:var(--muted);margin:8px 0"><strong>${esc(s.title)}</strong> — ${s.questions.length} questões</p>
      <p style="font-size:13px;color:var(--red);margin-bottom:14px;line-height:1.6">
        Remove matéria, progresso, revisões e favoritos.<br>Esta ação não pode ser desfeita.
      </p>
      <div class="form-group" style="margin-bottom:6px">
        <label class="gap-label">Digite sua chave de acesso para confirmar</label>
        <input type="password" id="del-key" class="gap-input" placeholder="Chave de acesso"
          autocomplete="off" onkeydown="if(event.key==='Enter')App.confirmDeleteSubject('${key}')">
      </div>
      <div id="del-err" class="login-err"></div>
      <div class="modal-btns">
        <button class="btn-p" onclick="hideModal()">Cancelar</button>
        <button class="btn-d" onclick="App.confirmDeleteSubject('${key}')">Excluir</button>
      </div>`);
    setTimeout(() => { const el=$('del-key'); if(el) el.focus(); }, 50);
  },

  async confirmDeleteSubject(key) {
    const keyEl   = $('del-key');
    const errEl   = $('del-err');
    const entered = keyEl ? keyEl.value.trim().toUpperCase() : '';
    if (!Object.keys(CREDENTIALS).includes(entered)) {
      if (errEl) errEl.textContent = 'Chave incorreta.';
      if (keyEl) { keyEl.value = ''; keyEl.focus(); }
      return;
    }
    const wasNative = !!(SUBJECTS[key] && SUBJECTS[key].isNative);
    hideModal();
    cleanupSubjectData(key);
    await deleteSubjectFromDB(key);
    delete SUBJECTS[key];
    /* CIA (ou outra matéria nativa) precisa de registro persistente à
       parte — sem isso, o próximo load recriaria a partir de QUESTIONS */
    if (wasNative) markNativeSubjectDeleted(key);
    renderManageSubjects();
  },

  /* navegar para seleção de modo */
  /* navegar para Biblioteca com confirmação e salvamento */
  goLibrary() {
    showModal(`
      <h2>🏠 Voltar para Biblioteca?</h2>
      <p style="font-size:14px;color:var(--muted);margin:12px 0">
        Seu progresso será salvo e você poderá continuar depois.
      </p>
      <div class="modal-btns">
        <button class="btn-s" onclick="hideModal()">Cancelar</button>
        <button class="btn-p" onclick="App.confirmGoLibrary()">Voltar</button>
      </div>
    `);
  },

  confirmGoLibrary() {
    hideModal();
    saveProgress();   // salva quiz normal; no-op em revisão e resultado
    stopTimer();
    S.reviewMode = false;
    renderSubjects();
  },

  goModeSelect() { renderModeSelect(); },

  /* iniciar em Modo Prova */
  startExam() {
    S.mode = 'exam';
    this.startNew();
  },

  /* iniciar em Modo Treino */
  startTraining() {
    S.mode = 'study';
    this.startNew();
  },

  /* encerrar sessão respeitando o modo ativo */
  finishSession() {
    hideModal();
    renderResult();
  },
  finishExam()     { S.mode = 'exam';  this.finishSession(); },
  finishTraining() { S.mode = 'study'; this.finishSession(); },

  /* validar credenciais e entrar */
  doLogin() {
    const nameEl = $('login-name');
    const keyEl  = $('login-key');
    const errEl  = $('login-err');
    const name = nameEl ? nameEl.value.trim() : '';
    const key  = keyEl  ? keyEl.value.trim().toUpperCase() : '';

    const canonical = CREDENTIALS[key];
    if (!canonical || name.toLowerCase() !== canonical.toLowerCase()) {
      if (errEl) errEl.textContent = 'Nome ou chave incorretos.';
      if (keyEl) { keyEl.value = ''; keyEl.focus(); }
      return;
    }

    S.userName = canonical;
    setUser(canonical);

    showAccessNotice(() => {
      renderSubjects();
    });
  },

  /* selecionar matéria e ir para home ou boas-vindas */
  selectSubject(key) {
    if (!SUBJECTS[key]) return;
    S.subject        = key;
    ACTIVE_QUESTIONS = SUBJECTS[key].questions;
    try { localStorage.setItem(SUBJECT_KEY, key); } catch(_) {}
    const saved = loadSaved();
    if (saved) {
      renderWelcome(saved);
    } else {
      renderHome();
    }
  },

  /* voltar à seleção de matéria */
  goSubjects() {
    stopTimer();
    renderSubjects();
  },

  /* encerrar sessão e voltar ao login */
  switchUser() {
    clearUser(); // limpa localStorage de usuário e progresso, chama renderLogin
  },

  setMode(m) {
    S.mode = m;
    const os = $('opt-study'), oe = $('opt-exam');
    if (os) os.classList.toggle('active', m === 'study');
    if (oe) oe.classList.toggle('active', m === 'exam');
  },

  startNew() {
    S.reviewMode = false;
    clearSave();
    S.deck      = prepareDeck();
    S.answers   = Array(S.deck.length).fill(undefined);
    S.validated = Array(S.deck.length).fill(false);
    S.flagged   = Array(S.deck.length).fill(false);
    S.discEval  = Array(S.deck.length).fill(undefined);
    S.idx       = 0;
    S.timer     = 0;
    S.startedAt = Date.now();
    S.entering  = true;
    syncBadge();
    startTimer();
    renderQuestion();
  },

  /* iniciar sessão de revisão a partir dos pendentes */
  startReview() {
    const subj    = S.subject || 'cia';
    const pending = getPendingReview(subj);
    if (!pending.length) return;
    const allQ    = SUBJECTS[subj]?.questions || [];
    const revQ    = pending
      .map(r => allQ.find(q => q.question === r.questionId))
      .filter(Boolean);
    if (!revQ.length) return;

    stopTimer();
    S.reviewMode = true;
    clearSave();
    S.deck       = prepareDeck(revQ);
    S.answers    = Array(S.deck.length).fill(undefined);
    S.validated  = Array(S.deck.length).fill(false);
    S.flagged    = Array(S.deck.length).fill(false);
    S.discEval   = Array(S.deck.length).fill(undefined);
    S.idx        = 0;
    S.timer      = 0;
    S.entering   = true;
    startTimer();
    renderQuestion();
  },

  /* ir para a tela de revisão da matéria atual */
  goReview() {
    stopTimer();
    S.reviewMode = false;
    renderReview();
  },

  /* ir para o início da matéria atual */
  goHome() {
    stopTimer();
    S.reviewMode = false;
    clearSave();
    S.mode = 'study';
    renderHome();
  },

  continueSaved() {
    const p = loadSaved();
    if (!p) { this.startNew(); return; }
    Object.assign(S, {
      deck: p.deck, answers: p.answers,
      validated: p.validated, flagged: p.flagged,
      discEval: p.discEval || Array((p.deck||[]).length).fill(undefined),
      mode: p.mode, idx: p.idx, timer: p.timer,
      startedAt: p.startedAt || Date.now(),
    });
    S.entering = true;
    syncBadge();
    startTimer();
    renderQuestion();
  },

  /* selecionar opção MC */
  pick(i) {
    if (S.validated[S.idx]) return;
    S.answers[S.idx] = i;
    renderQuestion();
  },

  /* digitar em lacuna — habilita/desabilita "Verificar" sem re-render (preserva o cursor) */
  typeGap(v) {
    S.answers[S.idx] = v;
    const btn = $('btn-verify');
    if (btn) btn.disabled = !v.trim();
  },

  /* digitar resposta discursiva — habilita "Verificar" sem re-render (preserva o cursor) */
  typeDisc(v) {
    S.answers[S.idx] = v;
    const btn = $('btn-verify');
    if (btn) btn.disabled = !v.trim();
  },

  /* selecionar Verdadeiro/Falso */
  pickTF(v) {
    if (S.validated[S.idx]) return;
    S.answers[S.idx] = v;
    renderQuestion();
  },

  /* selecionar correspondente de um item da associação (assoc) */
  pickAssoc(leftIdx, value) {
    if (S.validated[S.idx]) return;
    const q = S.deck[S.idx];
    const n = (q.options || []).length;
    const arr = Array.isArray(S.answers[S.idx]) ? [...S.answers[S.idx]] : Array(n).fill(undefined);
    const v = value === '' ? undefined : parseInt(value, 10);
    arr[leftIdx] = Number.isNaN(v) ? undefined : v;
    S.answers[S.idx] = arr;
    renderQuestion();
  },

  /* verificar resposta */
  verify() {
    if (S.validated[S.idx]) return;
    const q = S.deck[S.idx];
    if (q.type === 'gap') {
      const inp = $('gap-input');
      if (inp) S.answers[S.idx] = inp.value;
    }
    if (q.type === 'disc') {
      const inp = $('disc-input');
      if (inp) S.answers[S.idx] = inp.value;
    }
    if (!answerReady(q, S.answers[S.idx])) return;
    S.validated[S.idx] = true;
    S.justValidated    = true;
    save();

    /* disc: corretude depende da autoavaliação — fila de revisão só é
       atualizada quando o aluno marcar Acertei/Errei (App.selfGradeDisc) */
    if (q.type === 'disc') { renderQuestion(); return; }

    const subj = S.subject || 'cia';
    const ok   = isCorrectAt(S.idx);
    if (S.reviewMode) {
      /* em revisão: acertou sem flag → remove da fila; caso contrário → mantém */
      if (ok === true && !S.flagged[S.idx]) removeFromReview(q, subj);
      else addToReview(q, subj);
    } else {
      /* simulado normal: errou → adiciona à fila */
      if (ok === false) addToReview(q, subj);
    }
    renderQuestion();
  },

  /* autoavaliação da questão discursiva — chamada após "Verificar" */
  selfGradeDisc(correct) {
    if (!S.validated[S.idx]) return;
    const q       = S.deck[S.idx];
    const subj    = S.subject || 'cia';
    const newEval = correct ? 'correct' : 'wrong';
    if (S.discEval[S.idx] === newEval) return; // mesma autoavaliação já registrada — evita reprocessar a fila
    S.discEval[S.idx] = newEval;
    if (S.reviewMode) {
      if (correct && !S.flagged[S.idx]) removeFromReview(q, subj);
      else addToReview(q, subj);
    } else {
      if (correct) removeFromReview(q, subj);
      else addToReview(q, subj);
    }
    save();
    renderQuestion();
  },

  /* navegar entre questões */
  nav(dir) {
    const next = S.idx + dir;
    if (next < 0 || next >= S.deck.length) return;
    /* navegação é ação segura: verifica automaticamente uma resposta já dada
       mas ainda não confirmada, antes de sair da questão. Reaproveita
       App.verify() (que já evita dupla contagem e não inventa resposta
       vazia). Discursiva mantém o fluxo próprio de autoavaliação. */
    if (S.deck[S.idx].type !== 'disc') this.verify();
    S.idx      = next;
    S.entering = true;
    save();
    renderQuestion();
  },

  toggleFlag() {
    S.flagged[S.idx] = !S.flagged[S.idx];
    const subj = S.subject || 'cia';
    /* marcar → adiciona à fila; desmarcar no modo revisão → remove da fila */
    if (S.flagged[S.idx]) {
      addToReview(S.deck[S.idx], subj);
    } else if (S.reviewMode) {
      removeFromReview(S.deck[S.idx], subj);
    }
    save();
    renderQuestion();
  },

  toggleFavorite() {
    const q    = S.deck[S.idx];
    const subj = S.subject || 'cia';
    toggleFav(q, subj);
    renderQuestion();
  },

  toggleMode() {
    if (S.phase !== 'quiz') return;
    S.mode = S.mode === 'study' ? 'exam' : 'study';
    syncBadge();
    renderQuestion();
  },

  /* modal de confirmação antes de finalizar — ação segura é primária */
  confirmFinish() {
    /* ação segura: mesmo auto-verify de nav(), reaproveitado para não
       contar como "não respondida" uma questão respondida mas não
       confirmada no momento de finalizar. Discursiva mantém autoavaliação. */
    if (S.deck[S.idx].type !== 'disc') this.verify();
    const st = stats();
    showModal(`
      <h2>🏁 Finalizar Sessão?</h2>
      <div class="modal-grid">
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--green)">${st.correct}</span>
          <div class="modal-lbl">Acertos</div>
        </div>
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--red)">${st.wrong}</span>
          <div class="modal-lbl">Erros</div>
        </div>
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--muted)">${st.unanswered}</span>
          <div class="modal-lbl">Não respondidas</div>
        </div>
        <div class="modal-stat">
          <span class="modal-val" style="color:var(--blue)">${st.answered ? st.pct + '%' : '—'}</span>
          <div class="modal-lbl">Aproveitamento parcial</div>
        </div>
      </div>
      <div class="modal-btns">
        <button class="btn-p" onclick="hideModal()">⬅ Continuar</button>
        <button class="btn-d" onclick="App.finishSession()">Finalizar agora</button>
      </div>
    `);
  },

  /* deck de revisão com opções re-embaralhadas */
  reviewWrong() {
    const wrong = S.deck.filter((_, i) => isCorrectAt(i) === false);
    if (!wrong.length) return;
    S.deck      = prepareDeck(wrong);
    S.answers   = Array(S.deck.length).fill(undefined);
    S.validated = Array(S.deck.length).fill(false);
    S.flagged   = Array(S.deck.length).fill(false);
    S.discEval  = Array(S.deck.length).fill(undefined);
    S.idx       = 0;
    S.timer     = 0;
    S.phase     = 'quiz';
    S.entering  = true;
    startTimer();
    renderQuestion();
  },

  restart() {
    stopTimer();
    clearSave();
    S.mode       = 'study';
    S.reviewMode = false;
    renderHome();
  },

  exportJSON() {
    const st = stats();
    const data = {
      data: new Date().toISOString(),
      pontuacao: st.pct + '%',
      acertos: st.correct, erros: st.wrong,
      nao_respondidas: st.unanswered, total: st.total,
      tempo: fmt(S.timer), modo: S.mode,
      categorias: catStats(),
      detalhes: S.deck.map((q, i) => ({
        categoria: q.category,
        questao: q.question,
        verificada: S.validated[i],
        correta: isCorrectAt(i),
        marcada: S.flagged[i],
      })),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `simulado_cia_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },
};

/* ── Fechar modal clicando fora ──────────────────── */
$('modal-overlay').addEventListener('click', e => {
  if (e.target === $('modal-overlay')) hideModal();
});

/* ── Fechar menu de ações (⋮) de matéria ao clicar fora ──────────── */
document.addEventListener('click', e => {
  if (!e.target.closest('.row-menu-wrap')) {
    document.querySelectorAll('.row-menu.open').forEach(m => m.classList.remove('open'));
  }
});

/* ── Iniciar ─────────────────────────────────────── */
async function init() {
  /* carregar matérias customizadas (e overrides de matérias nativas
     editadas/ocultas/protegidas) do IndexedDB antes de renderizar —
     substitui a definição nativa em memória quando já existe versão
     persistida com a mesma chave (ex.: 'cia') */
  try {
    const customs = await loadCustomSubjects();
    customs.forEach(s => { SUBJECTS[s.key] = s; });
  } catch(_) {}

  /* matérias nativas excluídas permanentemente nunca são recriadas,
     mesmo que o banco embutido (QUESTIONS) ainda as defina no código */
  getNativeDeletedSubjects().forEach(key => { delete SUBJECTS[key]; });

  const user = getUser();
  if (!user) { renderLogin(); return; }
  S.userName = user.name;
  renderSubjects();
}
init();
</script>
