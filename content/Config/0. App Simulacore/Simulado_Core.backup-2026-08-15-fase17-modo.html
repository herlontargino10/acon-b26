<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SimulaCore</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='50' fill='%230f172a'/><circle cx='50' cy='50' r='42' fill='none' stroke='%233b82f6' stroke-width='6'/><text y='67' x='50' text-anchor='middle' font-family='system-ui,Arial,sans-serif' font-weight='900' font-size='54' fill='%23e2e8f0'>S</text></svg>">
<style>
/* ── Variáveis ──────────────────────────────────── */
:root {
  --bg:      #080d18;
  --surface: #0f172a;
  --card:    #111827;
  --card2:   #1a2235;
  --border:  #1e2d45;
  --txt:     #e2e8f0;
  --muted:   #64748b;
  --blue:    #3b82f6;
  --blue2:   #1d4ed8;
  --green:   #10b981;
  --red:     #ef4444;
  --amber:   #f59e0b;
  --r:       13px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

body {
  font-family: system-ui,'Segoe UI',Arial,sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
}

/* ── Cabeçalho fixo ─────────────────────────────── */
#header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(8,13,24,.97);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px 10px;
}
.hd-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.hd-brand-wrap {
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.hd-brand {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--blue);
  line-height: 1.2;
}
.hd-subject-name {
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .06em;
  text-transform: uppercase;
  line-height: 1;
}

/* label de sessão na tela final */
.result-session-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--muted);
  margin-bottom: 6px;
}

/* rodapé discreto */
#app-footer {
  text-align: center;
  padding: 28px 20px 16px;
  font-size: 11px;
  color: var(--border);
  letter-spacing: .1em;
  text-transform: uppercase;
  user-select: none;
}
.hd-meta {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13px;
  color: var(--muted);
}
#timer {
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--txt);
  min-width: 42px;
  transition: color .4s;
}
/* feedback visual do timer por tempo decorrido */
#timer.warn { color: var(--amber); }
#timer.crit { color: var(--red); }
#q-counter { font-weight: 700; color: var(--txt); }

/* barra de progresso */
.prog-track {
  height: 5px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 10px;
}
.prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), #60a5fa);
  border-radius: 999px;
  transition: width .4s cubic-bezier(.4,0,.2,1);
  width: 0%;
  box-shadow: 0 0 8px rgba(96,165,250,.35);
}

/* estatísticas no header */
.stats-row {
  display: flex;
  gap: 16px;
  font-size: 12px;
  flex-wrap: wrap;
  align-items: center;
}
.stat-it { display: flex; align-items: center; gap: 5px; }
/* aproveitamento destacado no canto direito */
.stat-pct {
  margin-left: auto;
  font-size: 13px;
  font-weight: 800;
  color: var(--txt);
  background: rgba(59,130,246,.12);
  border: 1px solid rgba(59,130,246,.25);
  border-radius: 6px;
  padding: 2px 8px;
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dg { background: var(--green); }
.dr { background: var(--red); }
.dm { background: var(--muted); }
.da { background: var(--amber); }

/* badge de modo */
.mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  transition: .15s;
  user-select: none;
  white-space: nowrap;
}
.mode-badge.study { border-color: var(--green); color: var(--green); background: rgba(16,185,129,.1); }
.mode-badge.exam  { border-color: var(--amber); color: var(--amber); background: rgba(245,158,11,.1); }

/* ── Layout principal ───────────────────────────── */
#app { max-width: 820px; margin: 0 auto; padding: 28px 20px 80px; }

/* ── Card ───────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 28px;
  box-shadow: 0 4px 40px rgba(0,0,0,.45);
}
/* animação só na troca de questão — evita jitter em pick/verify */
.card.entering { animation: fadeUp .2s ease; }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(7px); }
}
/* entrada da explicação */
@keyframes slideReveal {
  from { opacity:0; transform:translateY(-4px); }
}
/* resposta errada */
@keyframes shake {
  0%,100% { transform:translateX(0); }
  20%     { transform:translateX(-6px); }
  40%     { transform:translateX(6px); }
  60%     { transform:translateX(-4px); }
  80%     { transform:translateX(4px); }
}
/* resposta certa */
@keyframes pop {
  0%   { transform:scale(1); }
  45%  { transform:scale(1.013); }
  100% { transform:scale(1); }
}

/* ── Tela Home ──────────────────────────────────── */
.home-wrap { max-width: 520px; margin: 56px auto 0; }
.home-title { font-size: 30px; font-weight: 900; margin-bottom: 6px; }
.home-sub { color: var(--muted); margin-bottom: 26px; font-size: 14px; }

.home-opts { display: flex; flex-direction: column; gap: 11px; margin-bottom: 22px; }
.home-opt {
  display: flex; align-items: center; gap: 14px;
  padding: 15px 18px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 11px;
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
}
.home-opt:hover  { border-color: var(--blue); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.home-opt.active { border-color: var(--blue); background: rgba(59,130,246,.08); }
.home-opt-icon { font-size: 22px; }
.home-opt-text strong { display: block; font-size: 15px; }
.home-opt-text span   { font-size: 13px; color: var(--muted); }
.home-btn-row { display: flex; gap: 10px; }

/* ── Questão ────────────────────────────────────── */
.q-hd {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
  margin-bottom: 18px;
}
.q-tag {
  display: inline-flex; align-items: center;
  padding: 4px 12px;
  border-radius: 999px;
  background: rgba(59,130,246,.13);
  border: 1px solid rgba(59,130,246,.28);
  color: #93c5fd;
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
}
.btn-flag {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  padding: 5px 10px;
  cursor: pointer; font-size: 14px;
  transition: .15s; flex-shrink: 0;
  font-family: inherit;
}
.btn-flag:hover  { border-color: var(--amber); color: var(--amber); }
.btn-flag.flagged { background: rgba(245,158,11,.14); border-color: var(--amber); color: var(--amber); }

.q-text {
  font-size: 18px; font-weight: 600;
  color: var(--txt); line-height: 1.55;
  margin-bottom: 22px;
}

/* ── Opções MC ──────────────────────────────────── */
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
  padding: 13px 17px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  display: flex; align-items: center; gap: 12px;
  user-select: none;
  font-size: 15px;
}
.option:hover:not(.locked) { border-color: var(--blue); background: rgba(59,130,246,.06); box-shadow: inset 3px 0 0 rgba(59,130,246,.35); }
.option.selected { border-color: var(--blue); background: rgba(59,130,246,.09); box-shadow: inset 3px 0 0 rgba(59,130,246,.55); }
.option.correct  { border-color: var(--green); background: rgba(16,185,129,.11); box-shadow: inset 3px 0 0 rgba(16,185,129,.55); }
.option.wrong    { border-color: var(--red);   background: rgba(239,68,68,.11);  box-shadow: inset 3px 0 0 rgba(239,68,68,.55); }
.option.locked   { cursor: default; }
/* animações de feedback — só no render imediatamente após verificar */
.option.correct.anim { animation: pop .3s ease; }
.option.wrong.anim   { animation: shake .38s ease; }

.opt-ltr {
  width: 27px; height: 27px;
  border-radius: 50%;
  border: 1.5px solid var(--muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800;
  flex-shrink: 0;
  color: var(--muted);
  transition: .15s;
  line-height: 1;
}
.option.selected .opt-ltr { border-color: var(--blue);  color: var(--blue); }
/* ✓/✗ no circle após verificação */
.option.correct  .opt-ltr { border-color: var(--green); color: var(--green); font-size: 14px; font-weight: 700; }
.option.wrong    .opt-ltr { border-color: var(--red);   color: var(--red);   font-size: 14px; font-weight: 700; }

/* ── Input Lacuna ───────────────────────────────── */
.gap-wrap { display: flex; flex-direction: column; gap: 8px; }
.gap-label { font-size: 13px; color: var(--muted); }
.gap-input {
  width: 100%; padding: 13px 15px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  color: var(--txt);
  font-size: 16px; font-family: inherit;
  outline: none;
  transition: border-color .15s;
}
.gap-input:focus   { border-color: var(--blue); }
.gap-input.correct { border-color: var(--green); background: rgba(16,185,129,.07); }
.gap-input.wrong   { border-color: var(--red);   background: rgba(239,68,68,.07); }
.gap-input:disabled { opacity: .7; }
.gap-answer-hint { font-size: 13px; color: var(--green); margin-top: 4px; display: none; }
.gap-answer-hint.show { display: block; }

/* ── Explicação ─────────────────────────────────── */
.explanation {
  margin-top: 18px; padding: 14px 17px;
  border-radius: 10px;
  border-left: 3px solid var(--blue);
  background: rgba(59,130,246,.06);
  font-size: 14px; color: #cbd5e1;
  display: none;
}
.explanation.show { display: block; animation: slideReveal .2s ease; }
.exp-res { font-weight: 800; margin-bottom: 5px; font-size: 14px; }
.exp-res.ok      { color: var(--green); }
.exp-res.bad     { color: var(--red); }
.exp-res.neutral { color: var(--muted); }

/* ── Barra de botões ────────────────────────────── */
.btn-bar {
  display: flex; gap: 9px;
  margin-top: 24px; flex-wrap: wrap;
  align-items: center;
}
.spacer { flex: 1; }
/* separador visual entre Próxima e Finalizar — evita cliques acidentais */
.btn-sep {
  width: 1px;
  align-self: stretch;
  background: var(--border);
  margin: 4px 2px;
  flex-shrink: 0;
}

button {
  padding: 12px 18px;
  border: none; border-radius: 10px;
  cursor: pointer; font-weight: 700;
  font-size: 14px; font-family: inherit;
  transition: opacity .15s, transform .1s, background .15s;
  white-space: nowrap;
}
button:active:not(:disabled) { transform: scale(.97); }
button:disabled { opacity: .4; cursor: not-allowed; }

.btn-p  { background: var(--blue); color: #fff; box-shadow: 0 2px 10px rgba(59,130,246,.3); }
.btn-p:hover:not(:disabled)  { background: var(--blue2); box-shadow: 0 4px 18px rgba(59,130,246,.45); }
.btn-s  { background: var(--surface); border: 1px solid var(--border); color: var(--txt); }
.btn-s:hover:not(:disabled)  { border-color: var(--blue); }
.btn-d  { background: #450a0a; color: #fca5a5; border: 1px solid rgba(239,68,68,.3); }
.btn-d:hover:not(:disabled)  { background: var(--red); color: #fff; }
.btn-ok { background: #052e16; color: #6ee7b7; border: 1px solid rgba(16,185,129,.3); }
.btn-ok:hover:not(:disabled) { background: var(--green); color: #fff; }
/* botão Finalizar discreto — não compete com Próxima */
.btn-finish {
  background: transparent;
  border: 1px solid rgba(239,68,68,.3);
  color: #fca5a5;
  padding: 12px 13px;
  font-size: 13px;
  opacity: .7;
}
.btn-finish:hover:not(:disabled) { opacity: 1; background: #450a0a; border-color: var(--red); }

/* ── Modal ──────────────────────────────────────── */
#modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.78);
  z-index: 200; align-items: center;
  justify-content: center; padding: 20px;
}
#modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px; padding: 30px;
  max-width: 420px; width: 100%;
  box-shadow: 0 24px 80px rgba(0,0,0,.65);
  animation: fadeUp .2s ease;
}
.modal h2 { font-size: 19px; margin-bottom: 18px; }
.modal-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 11px; margin-bottom: 22px;
}
.modal-stat {
  background: var(--surface);
  border-radius: 10px; padding: 14px;
  text-align: center;
}
.modal-val { font-size: 28px; font-weight: 900; display: block; }
.modal-lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
.modal-btns { display: flex; gap: 10px; }
.modal-btns button { flex: 1; }

/* ── Tela de Resultado ──────────────────────────── */
.result-hero { text-align: center; padding: 36px 0 28px; }
.result-pct {
  font-size: 88px; font-weight: 900; line-height: 1;
  background: linear-gradient(135deg, var(--blue), var(--green));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.result-grade { font-size: 21px; font-weight: 700; margin-top: 10px; }
.result-lbl   { font-size: 14px; color: var(--muted); margin-top: 6px; }

.result-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
  gap: 11px; margin: 24px 0;
}
.res-stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 16px;
  text-align: center;
}
.res-val { font-size: 30px; font-weight: 900; display: block; }
.res-lbl { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* pontos fortes e pontos a reforçar */
.highlights {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 14px; margin-top: 28px;
}
.hl-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px; padding: 16px;
}
.hl-box h4 {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .07em;
  margin-bottom: 10px;
}
.hl-box.good { border-color: rgba(16,185,129,.25); }
.hl-box.bad  { border-color: rgba(239,68,68,.2); }
.hl-box.good h4 { color: var(--green); }
.hl-box.bad  h4 { color: var(--red); }
.hl-item {
  font-size: 13px; color: var(--txt);
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,.05);
  display: flex; justify-content: space-between; gap: 8px;
}
.hl-item:last-child { border-bottom: none; padding-bottom: 0; }
.hl-pct { color: var(--muted); font-size: 12px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.hl-empty { font-size: 13px; color: var(--muted); font-style: italic; }

/* gráfico por categoria */
.cat-section { margin-top: 28px; }
.cat-section h3 {
  font-size: 12px; font-weight: 700;
  color: var(--muted); text-transform: uppercase;
  letter-spacing: .08em; margin-bottom: 14px;
}
.cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
.cat-name {
  width: 160px; flex-shrink: 0;
  color: var(--txt); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.cat-track {
  flex: 1; height: 7px;
  background: var(--border);
  border-radius: 999px; overflow: hidden;
}
.cat-fill { height: 100%; border-radius: 999px; transition: width .6s .15s; }
.cat-pct {
  width: 36px; text-align: right;
  color: var(--muted); font-variant-numeric: tabular-nums;
  font-size: 12px;
}

/* ── Login ──────────────────────────────────────── */
.login-form  { display: flex; flex-direction: column; gap: 14px; }
.form-group  { display: flex; flex-direction: column; gap: 5px; }
.login-err   { font-size: 13px; color: var(--red); min-height: 18px; }

/* ── Info de usuário no cabeçalho ───────────────── */
.hd-user {
  display: flex; align-items: center;
  gap: 8px; font-size: 12px; color: var(--muted);
}
.hd-user strong { color: var(--txt); font-weight: 700; }
.btn-switch {
  font-size: 11px; color: var(--muted);
  background: none; border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 8px;
  cursor: pointer; font-family: inherit;
  font-weight: 600; transition: .15s;
}
.btn-switch:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }

/* ── Tela de boas-vindas ────────────────────────── */
.welcome-info {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 22px; text-align: center; margin: 20px 0;
}
.welcome-q {
  font-size: 42px; font-weight: 900; line-height: 1;
  color: var(--txt); font-variant-numeric: tabular-nums;
}
.welcome-q span { color: var(--muted); font-weight: 400; font-size: 32px; }
.welcome-lbl {
  font-size: 12px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .07em; margin-top: 6px;
}

/* ── Modal de aviso de acesso ───────────────────── */
#notice-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 300;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#notice-overlay.open { display: flex; }

.notice-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 32px 28px 24px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 24px 80px rgba(0,0,0,.7);
  animation: fadeUp .25s ease;
  text-align: center;
}
.notice-icon  { font-size: 26px; margin-bottom: 10px; }
.notice-title {
  font-size: 13px; font-weight: 800;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--txt); margin-bottom: 18px;
}
.notice-divider { height: 1px; background: var(--border); margin: 16px 0; }
.notice-body {
  font-size: 14px; color: #cbd5e1;
  line-height: 1.75; text-align: center;
}
.notice-body p { margin-bottom: 10px; }
.notice-body p:last-child { margin-bottom: 0; }
.notice-check-row {
  display: inline-flex; align-items: center;
  gap: 8px; font-size: 13px; color: var(--muted);
  cursor: pointer; user-select: none;
  margin: 18px 0 16px;
}
.notice-check-row input[type="checkbox"] {
  width: 15px; height: 15px;
  cursor: pointer; accent-color: var(--blue);
  flex-shrink: 0;
}
.notice-footer {
  font-size: 11px; color: var(--muted);
  margin-top: 14px; letter-spacing: .03em;
}
.notice-footer strong { color: var(--txt); }

/* ── Seleção de modo ────────────────────────────── */
.mode-card {
  padding: 20px 22px;
  border: 2px solid var(--border);
  border-radius: 13px;
  cursor: pointer;
  background: var(--surface);
  transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
}
.mode-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.mode-card.exam-card:hover  { border-color: var(--blue);  background: rgba(59,130,246,.06); }
.mode-card.train-card:hover { border-color: var(--green); background: rgba(16,185,129,.06); }
.mode-card-icon  { font-size: 30px; margin-bottom: 8px; }
.mode-card-title { font-size: 16px; font-weight: 800; margin-bottom: 6px; color: var(--txt); }
.mode-card-desc  { font-size: 13px; color: var(--muted); line-height: 1.65; }
.mode-card-tags  { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.mode-tag {
  font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 99px;
}
.exam-card  .mode-tag { border: 1px solid rgba(59,130,246,.35); color: #93c5fd; background: rgba(59,130,246,.08); }
.train-card .mode-tag { border: 1px solid rgba(16,185,129,.3);  color: #6ee7b7; background: rgba(16,185,129,.07); }

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmt(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return h > 0
    ? `${h}:${pad(m)}:${pad(s)}`
    : `${pad(m)}:${pad(s)}`;
}
function pad(n) { return String(n).padStart(2,'0'); }

/* Escapa HTML para evitar XSS ao inserir texto de questões */
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

const DB_NAME      = 'SimuladoCIA_v1';
const DB_VER       = 1;

/* ═══════════════════════════════════════════════════
   INDEXEDDB — bancos customizados
   ═══════════════════════════════════════════════════ */
let _db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    if (_db) { resolve(_db); return; }
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('subjects'))
        d.createObjectStore('subjects', { keyPath: 'key' });
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror   = e => reject(e.target.error);
  });
}

async function loadCustomSubjects() {
  try {
    const d = await openDB();
    return new Promise(res => {
      const req = d.transaction('subjects','readonly').objectStore('subjects').getAll();
      req.onsuccess = () => res(req.result || []);
      req.onerror   = () => res([]);
    });
  } catch(_) { return []; }
}

async function saveSubjectToDB(subj) {
  const d = await openDB();
  return new Promise((res, rej) => {
    const req = d.transaction('subjects','readwrite').objectStore('subjects').put(subj);
    req.onsuccess = () => res();
    req.onerror   = () => rej(req.error);
  });
}

async function deleteSubjectFromDB(key) {
  try {
    const d = await openDB();
    return new Promise(res => {
      const req = d.transaction('subjects','readwrite').objectStore('subjects').delete(key);
      req.onsuccess = () => res();
      req.onerror   = () => res();
    });
  } catch(_) {}
}

/* ═══════════════════════════════════════════════════
   IMPORTADOR DE QUESTÕES
   ═══════════════════════════════════════════════════ */
let _pendingImport = null;

/* Valida e normaliza array de questões brutas */
function parseQuestions(raw) {
  let data;
  try { data = JSON.parse(raw); }
  catch(_) { return { valid: [], invalid: 0, error: 'JSON inválido ou formato não suportado.' }; }

  if (!Array.isArray(data)) {
    if (data && Array.isArray(data.questions)) data = data.questions;
    else return { valid: [], invalid: 0, error: 'O JSON deve ser um array de questões.' };
  }

  const valid = []; let invalid = 0;
  data.forEach(q => {
    if (!q || typeof q !== 'object' || !q.question) { invalid++; return; }
    const type = String(q.type || 'mc').toLowerCase();
    if (!['mc','gap','tf','disc','assoc'].includes(type)) { invalid++; return; }
    if (type === 'mc') {
      if (!Array.isArray(q.options) || q.options.length < 2) { invalid++; return; }
      if (typeof q.correct !== 'number' || q.correct < 0 || q.correct >= q.options.length) { invalid++; return; }
    }
    if ((type === 'gap' || type === 'tf') && (q.correct === undefined || q.correct === '')) { invalid++; return; }

    let options = q.options || [];
    let correct = q.correct;
    /* assoc: pares [esquerda, direita] já corretamente casados; "correct" mapeia
       índice do item da esquerda -> índice (na ordem original de options) do
       correspondente correto. Segue o formato já usado pelo gerador de questões
       da plataforma (ver prompt "Gerar questões e importar"). */
    if (type === 'assoc') {
      if (!Array.isArray(q.options) || q.options.length < 2) { invalid++; return; }
      const pairsOk = q.options.every(p => Array.isArray(p) && p.length === 2 &&
        String(p[0] ?? '').trim() !== '' && String(p[1] ?? '').trim() !== '');
      if (!pairsOk) { invalid++; return; }
      const n = q.options.length;
      correct = Array.isArray(q.correct) && q.correct.length === n &&
        q.correct.every(x => Number.isInteger(x) && x >= 0 && x < n)
        ? q.correct
        : q.options.map((_, i) => i);
      options = q.options;
    }

    valid.push({
      type, question: String(q.question).trim(),
      category: q.category || 'Geral', options,
      correct, explanation: q.explanation || '',
      _id: makeQuestionId(),
    });
  });
  return { valid, invalid };
}

/* Lê File do sistema e retorna resultado parseado */
function importQuestions(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload  = e => res({ ...parseQuestions(e.target.result), fileName: file.name });
    r.onerror = () => res({ valid: [], invalid: 0, error: 'Erro ao ler arquivo.' });
    r.readAsText(file, 'utf-8');
  });
}

/* Cria matéria, persiste no IndexedDB e adiciona ao SUBJECTS */
async function createSubject(key, title, icon, questions) {
  const subj = { key, title, label: title, icon, questions, isCustom: true, importedAt: Date.now() };
  await saveSubjectToDB(subj);
  SUBJECTS[key] = subj;
  return subj;
}

function makeSubjectKey(name) {
  return 'custom_' + name.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,20) + '_' + Date.now();
}

/* ID estável de questão — usado por revisão/favoritos (q._id || q.question).
   Gerado uma única vez (criação/importação) e preservado ao editar. */
function makeQuestionId() {
  return 'q_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
}

/* ═══════════════════════════════════════════════════
   PERSISTÊNCIA (localStorage)
   ═══════════════════════════════════════════════════ */
const KEY = 'cia_sim_v3';
/* progresso de sessão de REVISÃO tem chave própria — nunca deve
   sobrescrever o progresso do simulado normal (KEY), e vice-versa. */
const REVIEW_PROGRESS_KEY = 'cia_review_sim_v1';

/* save()/loadSaved()/clearSave() continuam sendo o único mecanismo de
   persistência de progresso; apenas escolhem a chave certa conforme o
   modo atual (S.reviewMode) no instante da chamada. */
function progressKey() {
  return S.reviewMode ? REVIEW_PROGRESS_KEY : KEY;
}

function save() {
  if (S.phase !== 'quiz') return;
  try {
    localStorage.setItem(progressKey(), JSON.stringify({
      deck: S.deck, answers: S.answers,
      validated: S.validated, flagged: S.flagged,
      discEval: S.discEval,
      mode: S.mode, idx: S.idx, timer: S.timer,
      userName:  S.userName,
      startedAt: S.startedAt,
      subject:   S.subject || 'cia',
      reviewMode: S.reviewMode,   // rótulo de origem — usado por loadSaved() para reconhecer dado antigo/estranho sem apagá-lo
      ts: Date.now()
    }));
  } catch(_) {}
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(progressKey());
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (Date.now() - p.ts > 86400000) { localStorage.removeItem(progressKey()); return null; }
    /* dado salvo antes da separação normal/revisão (Fase 14) não tem
       "reviewMode" — trata-se como progresso normal, preservando
       compatibilidade. Se o rótulo existir e não bater com o modo atual,
       é um registro de outra origem (ex.: revisão antiga sob a chave
       normal) — ignora sem apagar, para não perder dados de ninguém. */
    if (p.reviewMode !== undefined && p.reviewMode !== S.reviewMode) return null;
    /* ignorar progresso de outro usuário */
    if (p.userName && S.userName && p.userName !== S.userName) return null;
    /* ignorar progresso de outra matéria (salvo=undefined → trata como 'cia') */
    const pSubject = p.subject || 'cia';
    if (S.subject && pSubject !== S.subject) return null;
    return p;
  } catch(_) { return null; }
}

function clearSave() {
  try { localStorage.removeItem(progressKey()); } catch(_) {}
}

/* Salva apenas progresso de simulado normal (não revisão) */
function saveProgress() {
  if (S.phase === 'quiz' && !S.reviewMode) save();
}

/* Retorna progresso salvo para a matéria ativa (ou null) */
function restoreProgress() {
  return loadSaved();
}

function setUser(name) {

/* ═══════════════════════════════════════════════════
   REVISÃO — fila persistente
   ═══════════════════════════════════════════════════ */
function loadReview() {
  try { return JSON.parse(localStorage.getItem(REVIEW_KEY)) || []; } catch(_) { return []; }
}
function saveReview(q) {
  try { localStorage.setItem(REVIEW_KEY, JSON.stringify(q)); } catch(_) {}
}

/* addToReview — cria ou atualiza entrada; reason: 'wrong'|'flag' */
function addToReview(q, subj) {
  const id    = q._id || q.question;
  const queue = loadReview();
  const hit   = queue.find(r => r.questionId === id && r.subject === subj);
  if (hit) {
    hit.mistakes++;
    hit.lastSeen = Date.now();
    hit.status   = 'pending';
    delete hit.doneAt;
  } else {
    queue.push({ subject: subj, questionId: id, lastSeen: Date.now(), mistakes: 1, status: 'pending' });
  }
  saveReview(queue);
}

/* removeFromReview — marca como concluída */
function removeFromReview(q, subj) {
  const id    = q._id || q.question;
  const queue = loadReview();
  const hit   = queue.find(r => r.questionId === id && r.subject === subj);
  if (hit) { hit.status = 'done'; hit.doneAt = Date.now(); saveReview(queue); }
}

function getPendingReview(subj) {
  return loadReview().filter(r => r.subject === subj && r.status === 'pending');
}

function getTodayDone(subj) {
  const start = new Date(); start.setHours(0,0,0,0);
  return loadReview().filter(r => r.subject === subj && r.status === 'done' && r.doneAt >= start.getTime()).length;
}

/* ═══════════════════════════════════════════════════
   FAVORITOS
   ═══════════════════════════════════════════════════ */
function loadFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(_) { return []; }
}
function isFav(q, subj) {
  const id = q._id || q.question;
  return loadFavs().includes(`${subj}::${id}`);
}
function toggleFav(q, subj) {
  const id   = `${subj}::${(q._id || q.question)}`;
  const favs = loadFavs();
  const idx  = favs.indexOf(id);
  idx >= 0 ? favs.splice(idx, 1) : favs.push(id);
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(_) {}
  return idx < 0;
}

/* ═══════════════════════════════════════════════════
   PREPARAÇÃO DO DECK — aceita fonte opcional para revisar erros
   ═══════════════════════════════════════════════════ */
function prepareDeck(source) {
  return shuffle(source || ACTIVE_QUESTIONS).map(q => {
    const base = { ...q, _id: q._id || q.question };
    if (q.type === 'mc') {
      const idxs = shuffle([0,1,2,3]);
      return {
        ...base,
        shuffledOptions: idxs.map(i => q.options[i]),
        shuffledCorrect: idxs.indexOf(q.correct),
      };
    }
    if (q.type === 'assoc') {
      const n = (q.options || []).length;
      return {
        ...base,
        /* assocOrder[posição exibida] = índice original do item da direita */
        assocOrder: shuffle([...Array(n).keys()]),
      };
    }
    return base;
  });
}

   ═══════════════════════════════════════════════════ */
function updateTimerColor(sec) {
  const el = $('timer');
  if (!el) return;
  el.classList.toggle('warn', sec >= 1800 && sec < 3600);
  el.classList.toggle('crit', sec >= 3600);
}

function startTimer() {
  stopTimer();
  S.timerRef = setInterval(() => {
    S.timer++;
    const el = $('timer');
    if (el) el.textContent = fmt(S.timer);
    updateTimerColor(S.timer);
    if (S.timer % 30 === 0) save();
  }, 1000);
}
function stopTimer() {
  if (S.timerRef) { clearInterval(S.timerRef); S.timerRef = null; }
}

/* ═══════════════════════════════════════════════════
   ESTATÍSTICAS
   ═══════════════════════════════════════════════════ */
function isCorrectAt(i) {
  const q = S.deck[i];
  const a = S.answers[i];
  if (!S.validated[i]) return null;

  if (q.type === 'mc') return a === q.shuffledCorrect;

  if (q.type === 'tf') {
    const correctBool = (q.correct === true || q.correct === 'true' || q.correct === 1);
    return a === correctBool;
  }

  if (q.type === 'assoc') {
    const n = (q.options || []).length;
    if (!Array.isArray(a) || a.length !== n) return false;
    for (let li = 0; li < n; li++) {
      const expected = (q.correct && q.correct[li] !== undefined) ? q.correct[li] : li;
      if (a[li] !== expected) return false;
    }
    return true;
  }

  if (q.type === 'disc') {
    /* corretude não é derivável do texto — depende da autoavaliação do aluno */
    const ev = S.discEval[i];
    if (ev === undefined) return null;
    return ev === 'correct';
  }

  /* gap (padrão) */
  if (a === undefined) return null;
  return String(a).trim().toLowerCase() === String(q.correct).trim().toLowerCase();
}

/* Indica se a resposta atual do aluno já é suficiente para habilitar "Verificar" */
function answerReady(q, a) {
  switch (q.type) {
    case 'mc':    return a !== undefined;
    case 'tf':    return a === true || a === false;
    case 'gap':   return a !== undefined && String(a).trim() !== '';
    case 'disc':  return a !== undefined && String(a).trim() !== '';
    case 'assoc': {
      const n = (q.options || []).length;
      return Array.isArray(a) && a.length === n && a.every(v => v !== undefined);
    }
    default: return false;
  }
}

function stats() {
  let correct = 0, wrong = 0, unanswered = 0, flagged = 0;
  S.deck.forEach((_, i) => {
    if (S.flagged[i]) flagged++;
    const r = isCorrectAt(i);
    if (r === null) unanswered++;
    else if (r) correct++;
    else wrong++;
  });
  const answered = correct + wrong;
  const pct = answered ? Math.round(correct / answered * 100) : 0;
  return { correct, wrong, unanswered, flagged, answered, total: S.deck.length, pct };
}

function catStats() {
  const map = {};
  S.deck.forEach((q, i) => {
    if (!S.validated[i]) return;
    const c = q.category;
    if (!map[c]) map[c] = { correct: 0, total: 0 };
    map[c].total++;
    if (isCorrectAt(i)) map[c].correct++;
  });
  return Object.entries(map)
    .map(([name, d]) => ({ name, ...d, pct: Math.round(d.correct / d.total * 100) }))
    .sort((a, b) => b.total - a.total);
}

/* ═══════════════════════════════════════════════════
   RENDER — CABEÇALHO
   ═══════════════════════════════════════════════════ */
function renderHeader() {
  const badge   = $('mode-badge');
  const counter = $('q-counter');
  const fill    = $('prog-fill');
  const srow    = $('stats-row');
  const timerEl = $('timer');
  const uinfo   = $('user-info');

  /* exibe usuário + botão Trocar em todas as fases exceto login */
  if (uinfo) {
    uinfo.innerHTML = S.userName && S.phase !== 'login'
      ? `<strong>${esc(S.userName)}</strong>
         <button class="btn-switch" onclick="App.switchUser()">Trocar usuário</button>`
      : '';
  }

  /* matéria atual abaixo do brand */
  const subjNameEl = $('hd-subject-name');
  if (subjNameEl) {
    const inSession = ['quiz','review','result','home','modeselect'].includes(S.phase);
    subjNameEl.textContent = (inSession && S.subject && SUBJECTS[S.subject])
      ? SUBJECTS[S.subject].label : '';
  }

  /* botão Biblioteca: visível durante simulado, revisão e resultado */
  const libWrap = $('lib-btn-wrap');
  if (libWrap) {
    libWrap.classList.toggle('visible', ['quiz','review','result'].includes(S.phase));
  }

  if (S.phase !== 'quiz') {
    badge.style.display = 'none';
    counter.textContent = '';
    fill.style.width    = '0%';
    srow.innerHTML      = '';
    timerEl.textContent = '';
    timerEl.className   = '';
    return;
  }

  const pct = ((S.idx + 1) / S.deck.length * 100).toFixed(1);
  fill.style.width    = pct + '%';
  counter.textContent = `${S.idx + 1} / ${S.deck.length}`;

  if (S.reviewMode) {
    /* modo revisão: oculta badge de modo e timer, mostra indicador simples */
    badge.style.display = 'none';
    timerEl.textContent = '';
    timerEl.className   = '';
    srow.innerHTML = `<span class="review-pill">🔁 Revisão</span>`;
    return;
  }

  badge.style.display = '';
  syncBadge();
  timerEl.textContent = fmt(S.timer);
  updateTimerColor(S.timer);

  const st = stats();
  srow.innerHTML = `
    <div class="stat-it"><span class="dot dg"></span>${st.correct} acertos</div>
    <div class="stat-it"><span class="dot dr"></span>${st.wrong} erros</div>
    <div class="stat-it"><span class="dot dm"></span>${st.unanswered} restantes</div>
    ${st.flagged ? `<div class="stat-it"><span class="dot da"></span>${st.flagged} marcadas</div>` : ''}
    ${st.answered ? `<span class="stat-pct">${st.pct}% aproveit.</span>` : ''}
  `;
}

function syncBadge() {
  const b = $('mode-badge');
  if (!b) return;
  if (S.mode === 'study') {
    b.textContent = '📚 Treino';
    b.className = 'mode-badge study';
  } else {
    b.textContent = '🎯 Prova';
    b.className = 'mode-badge exam';
  }
}

   AVISO DE ACESSO — exibe uma vez por dispositivo
   ═══════════════════════════════════════════════════ */
function showAccessNotice(onClose) {
  /* já aceitou antes e não quer ver novamente */
  if (localStorage.getItem(NOTICE_KEY) === 'true') { onClose(); return; }

  const overlay  = $('notice-overlay');
  const btn      = $('notice-btn');
  const userSpan = $('notice-user');
  const chk      = $('notice-check');

  if (userSpan) userSpan.textContent = S.userName || '';
  if (chk)      chk.checked = false;

    onClose();
  };
}

/* ═══════════════════════════════════════════════════
   RENDER — SELEÇÃO DE MATÉRIA
   ═══════════════════════════════════════════════════ */

  S.phase   = 'subjects';
  S.subject = null;
  ACTIVE_QUESTIONS = [];
  renderHeader();

  /* inspecionar progresso salvo sem filtro de matéria */
  let savedKey = null;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (Date.now() - p.ts <= 86400000) {
        const pUser = p.userName;
        if (!pUser || !S.userName || pUser === S.userName) {
          savedKey = p.subject || 'cia';
        }
      }
    }
  } catch(_) {}

  /* última matéria usada (para destaque) */
  let lastKey = null;
  try { lastKey = localStorage.getItem(SUBJECT_KEY); } catch(_) {}

  const allEntries = Object.entries(SUBJECTS);

  /* ── classificação das matérias ─────────────────────────────────
     Biblioteca mostra só matérias reais: nativas disponíveis (CIA),
     importadas, criadas manualmente ou duplicadas. Sem catálogo de
     matérias futuras/placeholders — tudo em SUBJECTS já é real. ── */

  /* ── cartão "Minhas Matérias" ─────────────── */
  function minhasCard([key, subj]) {
    const hasSaved = key === savedKey;
    const pending  = getPendingReview(key).length;

        ${hasSaved    ? `<span class="subject-badge">↩ Continuar</span>` : ''}

        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn-p" style="font-size:13px" onclick="App.createEmptySubject()">＋ Nova Matéria</button>

      </div>`
    : `<div class="home-opts">${minhasEntries.map(minhasCard).join('')}</div>`;

  const ocultasHTML = ocultasEntries.length === 0 ? '' : `
    <details class="hidden-section" style="margin-top:18px">

      </summary>
      <div class="hidden-body">
        ${ocultasEntries.map(([key, s]) => `
          <div class="manage-row" style="padding:10px 0">
            <span style="font-size:20px;opacity:.5;flex-shrink:0">${s.icon}</span>
            <div class="manage-row-info">

              <div class="manage-row-meta">${s.questions.length} questões</div>
            </div>
            <button class="btn-ok" style="padding:6px 12px;font-size:12px"
              onclick="App.toggleHideSubject('${key}')">👁 Restaurar</button>
          </div>`).join('')}
      </div>
    </details>`;

  $('app').innerHTML = `
    <div class="card home-wrap entering">
      <div class="home-title">SIMULACORE</div>
      <div class="home-sub">Treino &bull; Prova &bull; Evolução</div>

      <div style="display:flex;gap:8px;margin-top:18px">
        <button class="btn-s" style="flex:1;font-size:12px" onclick="App.openImport()">📥 Importar</button>
        <button class="btn-s" style="font-size:12px" onclick="App.goManageSubjects()">⚙ Gerenciar</button>
      </div>

      <div class="lib-section-hd">📚 Minhas Matérias</div>
      ${minhasHTML}

/* ═══════════════════════════════════════════════════
   EDITOR — utilitários de formulário de questão
   ═══════════════════════════════════════════════════ */

/* Constrói os campos dinâmicos do formulário de acordo com o tipo */
function buildDynamicFields(q) {
  const t = q.type || 'mc';
  if (t === 'mc') {
    const opts = [...(q.options || [])];
    while (opts.length < 4) opts.push('');
    const ltrs = ['A','B','C','D'];
    return `<div class="form-group">
      <label class="gap-label">Alternativas &mdash; marque a correta</label>
      ${opts.map((o, i) => `<div class="qf-opt-row">
        <input type="radio" name="qf-correct" id="qfr${i}" value="${i}" ${q.correct===i?'checked':''}>
        <label for="qfr${i}" class="qf-opt-lbl">${ltrs[i]}</label>
        <input type="text" id="qfopt${i}" class="gap-input" style="margin:0"
          value="${esc(o)}" placeholder="Opção ${ltrs[i]}...">
      </div>`).join('')}
    </div>`;
  }
  if (t === 'tf') {
    const isTrue = q.correct === true || q.correct === 'true' || q.correct === 1;
    return `<div class="form-group">
      <label class="gap-label">Resposta correta</label>
      <div style="display:flex;gap:18px;margin-top:8px">
        <label style="display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer">
          <input type="radio" name="qf-tf" value="true" ${isTrue?'checked':''}> Verdadeiro
        </label>
        <label style="display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer">
          <input type="radio" name="qf-tf" value="false" ${!isTrue?'checked':''}> Falso
        </label>
      </div>
    </div>`;
  }
  if (t === 'gap') {
    return `<div class="form-group">
      <label class="gap-label">Resposta esperada</label>
      <input type="text" id="qfcorrect" class="gap-input"
        value="${esc(String(q.correct ?? ''))}" placeholder="Ex: abafamento">
    </div>`;
  }
  if (t === 'disc') {
    return `<div class="form-group">
      <label class="gap-label">Gabarito modelo (opcional)</label>
      <textarea id="qfcorrect" class="gap-input" rows="2" style="resize:vertical"
        placeholder="Resposta esperada para consulta...">${esc(String(q.correct ?? ''))}</textarea>
    </div>`;
  }
  if (t === 'assoc') {
    const pairs = (q.options && q.options.length ? q.options : [['',''],['',''],['','']]);
    return `<div class="form-group">
      <label class="gap-label">Pares de associação &mdash; item da esquerda ↔ correspondente</label>
      <div id="assoc-pairs">
        ${pairs.map((p, i) => `<div class="qf-opt-row" data-assoc-row="${i}">
          <input type="text" class="gap-input" style="margin:0" id="assoc-left-${i}"
            value="${esc((p && p[0]) || '')}" placeholder="Item ${i+1}">
          <span style="color:var(--muted);flex-shrink:0">↔</span>
          <input type="text" class="gap-input" style="margin:0" id="assoc-right-${i}"
            value="${esc((p && p[1]) || '')}" placeholder="Correspondente">
          <button type="button" class="btn-d" style="padding:6px 9px;font-size:12px;flex-shrink:0"
            onclick="App.removeAssocPair(${i})" title="Remover par">✕</button>
        </div>`).join('')}
      </div>
      <button type="button" class="btn-s" style="margin-top:6px;font-size:12px"
        onclick="App.addAssocPair()">＋ Adicionar par</button>
    </div>`;
  }
  return '';
}

/* Lê o formulário atual e retorna um objeto de questão */
function readQuestionForm() {
  const activeTab = document.querySelector('.qtype-tab.active');
  const type      = activeTab ? activeTab.dataset.type : 'mc';
  const category    = ($('qf-category')    || {}).value?.trim() || 'Geral';
  const question    = ($('qf-question')    || {}).value?.trim() || '';
  const explanation = ($('qf-explanation') || {}).value?.trim() || '';
  let options = [], correct;
  if (type === 'mc') {
    options = [0,1,2,3].map(i => ($('qfopt' + i) || {}).value?.trim() || '');
    const r = document.querySelector('input[name="qf-correct"]:checked');
    correct = r ? parseInt(r.value) : 0;
  } else if (type === 'tf') {
    const r = document.querySelector('input[name="qf-tf"]:checked');
    correct = r ? r.value === 'true' : true;
  } else if (type === 'assoc') {
    const rows = document.querySelectorAll('[data-assoc-row]');
    options = Array.from(rows).map(row => {
      const i     = row.dataset.assocRow;
      const left  = ($('assoc-left-'  + i) || {}).value?.trim() || '';
      const right = ($('assoc-right-' + i) || {}).value?.trim() || '';
      return [left, right];
    });
    correct = options.map((_, i) => i);
  } else {
    correct = ($('qfcorrect') || {}).value?.trim() || '';
  }
  return { type, category, question, options, correct, explanation };
}

/* Remove progresso, revisões e favoritos de uma matéria */
function cleanupSubjectData(key) {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if ((p.subject || 'cia') === key) localStorage.removeItem(KEY);
    }
  } catch(_) {}
  try {
    const rawReview = localStorage.getItem(REVIEW_PROGRESS_KEY);
    if (rawReview) {
      const p = JSON.parse(rawReview);
      if ((p.subject || 'cia') === key) localStorage.removeItem(REVIEW_PROGRESS_KEY);
    }
  } catch(_) {}
  try {
    const queue = loadReview().filter(r => r.subject !== key);
    localStorage.setItem(REVIEW_KEY, JSON.stringify(queue));
  } catch(_) {}
  try {
    const favs = loadFavs().filter(f => !f.startsWith(key + '::'));
    localStorage.setItem(FAV_KEY, JSON.stringify(favs));
  } catch(_) {}
}

function renderManageSubjects() {
  S.phase = 'manage';
  renderHeader();
  const customs = Object.values(SUBJECTS).filter(s => s.isCustom);
  const visible = customs.filter(s => !s.hidden);
  const hidden  = customs.filter(s =>  s.hidden);

  /* botões de uma matéria — visível ou oculta. Todas as matérias do
     usuário disponibilizam o mesmo conjunto de ações (Abrir, Editar,
     Exportar, Duplicar, Ocultar/Restaurar, Proteger, Excluir); só a
     ação de ocultar/restaurar e o estilo mudam conforme o estado. */
  function subjectRow(s) {
    const prot   = s.protected;
    const hid    = !!s.hidden;
    const dimmed = hid ? 'opacity:.5;' : '';
    return `<div class="manage-row">
      <span style="font-size:${hid?20:22}px;flex-shrink:0;${dimmed}">${s.icon}</span>
      <div class="manage-row-info">
        <div class="manage-row-title"${hid ? ' style="color:var(--muted)"' : ''}>
          ${esc(s.title)}
          ${prot ? '<span class="badge-protected">🔒</span>' : ''}
        </div>
        <div class="manage-row-meta">${s.questions.length} questões${s.importedAt ? ' &bull; ' + new Date(s.importedAt).toLocaleDateString('pt-BR') : ''}</div>
      </div>
      <div class="row-menu-wrap">
        <button class="row-menu-btn" onclick="App.toggleRowMenu(event,'${s.key}')" title="Ações">⋮</button>
        <div class="row-menu" id="row-menu-${s.key}">
          <button onclick="App.selectSubject('${s.key}')">Abrir</button>
          <button onclick="App.openSubjectEditor('${s.key}')">Editar</button>
          <button onclick="App.exportSubjectBank('${s.key}')">Exportar</button>
          <button onclick="App.duplicateSubject('${s.key}')">Duplicar</button>
          ${hid
            ? `<button onclick="App.toggleHideSubject('${s.key}')">Restaurar</button>`
            : `<button onclick="App.toggleHideSubject('${s.key}')">Ocultar</button>
               <button onclick="App.toggleProtectSubject('${s.key}')">${prot ? 'Remover proteção' : 'Proteger'}</button>`}
          <button class="row-menu-danger" onclick="App.deleteSubject('${s.key}')" ${prot?'disabled':''}>Excluir</button>
        </div>
      </div>
    </div>`;
  }

  const visibleRows = visible.length === 0
    ? `<div class="subject-empty">Nenhuma matéria ativa. Crie ou importe uma abaixo.</div>`
    : visible.map(subjectRow).join('');

  const hiddenSection = hidden.length === 0 ? '' : `
    <details class="hidden-section">
      <summary class="hidden-toggle">
        <span>Matérias Ocultas — ${hidden.length}</span>
        <span style="font-size:11px">▼</span>
      </summary>
      <div class="hidden-body">${hidden.map(subjectRow).join('')}</div>
    </details>`;

  $('app').innerHTML = `
    <div class="card home-wrap entering">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <button class="btn-s" style="padding:6px 11px;font-size:12px"

        <button class="btn-s" style="flex:1;font-size:12px" onclick="App.openImport()">📥 Importar JSON</button>
      </div>
    </div>
  `;
}
