<style>

:root{
--bg:#0b0f19;
--card:#151f32;
--card2:#101827;
--txt:#f1f5f9;
--muted:#94a3b8;

--blue:#1fb6ff;
--green:#10b981;
--red:#ef4444;
}

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:
system-ui,
Segoe UI,
Arial;

background:
linear-gradient(
180deg,
#0b0f19,
#151f32
);

color:
var(--txt);

}

header{

position:sticky;

top:0;

z-index:10;

padding:20px;

background:
rgba(11,15,25,.95);

backdrop-filter:
blur(12px);

border-bottom:
1px solid #233;

}

.container{

max-width:
1000px;

margin:auto;

padding:
20px;

}

.progress{

height:
10px;

background:
#1e293b;

border-radius:
999px;

overflow:
hidden;

}

.progress-fill{

height:
100%;

width:
0;

background:
linear-gradient(
90deg,
#1fb6ff,
#0ea5e9
);

transition:
.4s;

}

.stats{

display:flex;

gap:16px;

flex-wrap:wrap;

margin-top:12px;

color:
var(--muted);

}

.card{

background:
var(--card);

border-radius:
16px;

padding:
28px;

box-shadow:
0 20px 60px rgba(0,0,0,.35);

animation:
fade .25s;

}

@keyframes fade{

from{

opacity:0;

transform:
translateY(10px);

}

}

.tag{

display:inline-block;

padding:
6px 12px;

border-radius:
999px;

background:
#0f172a;

color:
#7dd3fc;

margin-bottom:
10px;

}

.option{

padding:
14px;

border:
1px solid #334155;

margin:
12px 0;

border-radius:
12px;

cursor:pointer;

transition:
.2s;

}

.option:hover{

border-color:
var(--blue);

}

.selected{

border-color:
var(--blue);

}

.correct{

background:
rgba(16,185,129,.2);

border-color:
var(--green);

}

.wrong{

background:
rgba(239,68,68,.2);

border-color:
var(--red);

}

textarea,
input{

width:100%;

padding:14px;

background:#0f172a;

color:white;

border:1px solid #334;

border-radius:12px;

}

.buttons{

display:flex;

justify-content:space-between;

margin-top:20px;

}

button{

padding:
14px 18px;

border:none;

border-radius:12px;

cursor:pointer;

font-weight:700;

background:
var(--blue);

color:white;

}

.explanation{

display:none;

margin-top:20px;

padding:16px;

border-left:
4px solid var(--blue);

background:
#0f172a;

}

.finish{

text-align:center;

}

.score{

font-size:
72px;

font-weight:
900;

color:
var(--green);

}

</style>

</head>
